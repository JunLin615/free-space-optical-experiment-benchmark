name: Evaluation infrastructure

on:
  pull_request:
  push:
    branches: [main, "feat/**", "fix/**", "research/**"]

jobs:
  evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          cache: pip
      - name: Install pinned release environment
        run: |
          python tools/check_release_environment.py --requirements > "$RUNNER_TEMP/rc1-requirements.txt"
          python -m pip install --no-deps -r "$RUNNER_TEMP/rc1-requirements.txt"
      - name: Verify release environment
        run: python tools/check_release_environment.py --check
      - name: Validate evaluation protocols and example library
        run: |
          python -m tools.protocols
          python -m tools.case_library
      - name: Verify public variant reproducibility
        run: python tools/variants.py check-public
      - name: Test evaluation infrastructure
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check portable replay of Windows-origin evidence
        run: |
          python -m tools.baseline runs/2026-09-28-gpt-6-luna-verified-release/manifest.json \
            --output-root "$RUNNER_TEMP/optics-replay" --replay-suffix ci-smoke --check
      - name: Validate stored measured analyses
        run: |
          python tools/analyze_baseline.py runs/2026-09-28-gpt-6-luna-verified-release --check
          python tools/analyze_baseline.py runs/2026-09-28-gpt-6-luna-development-release --check
          python tools/analyze_baseline.py runs/2026-09-28-gpt-6-luna-variants-release --check
      - name: Verify rc1 pinned evidence
        run: python tools/qualify_release.py --check
      - name: Verify vNext release and synthetic hidden policy checks
        run: |
          python tools/qualify_vnext.py --check
          python -m tools.hidden_eval check-map
