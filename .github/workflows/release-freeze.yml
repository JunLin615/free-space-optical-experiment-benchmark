name: Stable release freeze

on:
  pull_request:
  push:
    branches: [main, "release/**"]

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          cache: pip
      - name: Install pinned release environment
        run: |
          python tools/check_release_environment.py --requirements > "$RUNNER_TEMP/release-requirements.txt"
          python -m pip install --no-deps -r "$RUNNER_TEMP/release-requirements.txt"
      - name: Verify canonical corpus and public question parity
        run: |
          python tools/check_release_environment.py --check
          python tools/validate_cases.py
          python tools/check_corpus.py
          python tools/render_cases.py --check
          python tools/render_zh_cn.py --check
          python tools/check_localization.py
      - name: Verify autonomous scoring and conservative development fixtures
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python tools/run_case_fixtures.py
          python tools/build_open_reasoning_fixtures.py --check
      - name: Qualify all three release lines
        run: |
          python tools/qualify_release.py --check
          python tools/qualify_vnext.py --check
          python tools/qualify_stable.py --check
      - name: Verify frozen history and measured campaign
        run: |
          python -m tools.check_frozen_history
          python -m tools.analyze_campaign benchmark/results/campaigns/2026-09-28-multimodel-020rc1/campaign.json --check
          python -m tools.hidden_eval check-map
