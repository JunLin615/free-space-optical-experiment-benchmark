name: Benchmark checks

on:
  pull_request:
  push:
    branches: [main, "feat/**", "fix/**", "research/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate canonical cases
        run: python tools/validate_cases.py
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Verify generated question bank
        run: python tools/render_cases.py --check
