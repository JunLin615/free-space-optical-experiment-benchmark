name: Benchmark checks

on:
  pull_request:
  push:
    branches: [main, "feat/**", "fix/**", "research/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          cache: pip
      - name: Install pinned release environment
        run: |
          python tools/check_release_environment.py --requirements > "$RUNNER_TEMP/rc1-requirements.txt"
          python -m pip install --no-deps -r "$RUNNER_TEMP/rc1-requirements.txt"
      - name: Verify pinned release environment
        run: python tools/check_release_environment.py --check
      - name: Validate canonical cases
        run: python tools/validate_cases.py
      - name: Verify complete preserved seed migration
        run: python tools/check_corpus.py
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Challenge scoring fixtures
        run: python tools/run_case_fixtures.py
      - name: Check verification-status evidence
        run: python tools/check_verification_status.py
      - name: Verify generated question bank
        run: python tools/render_cases.py --check
      - name: Verify complete-corpus coverage outputs
        run: python tools/generate_coverage.py --check
      - name: Verify release qualification and pinned evidence
        run: python tools/qualify_release.py --check
