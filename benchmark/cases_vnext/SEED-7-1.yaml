  derivation: 'Translated the original seed prompt and answer outline. Revision 0.1.1 keeps four distinct
    plausible causes sufficient; listed fault families are examples, not mandatory categories. Clarification:
    any two aperture centers define a line; the possible fault is disagreement with the intended reference
    axis or an unreachable or obstructed ray path, not generic non-collinearity of two points. Revision
    0.2.0 adds an executable typed causal contract without changing the public scientific question.'
  license_status: CC-BY-4.0 (project benchmark content)
task:
  statement: In a two-mirror, two-aperture alignment setup, adjustment can center the beam in either aperture,
    but it cannot be made to pass through both aperture centers at once. Diagnose the setup before assuming
    that more mirror adjustment will solve it.
  questions:
  - id: q1
    request: List at least four plausible causes.
  - id: q2
    request: Separate alignment-procedure faults from geometric or hardware limits.
  - id: q3
    request: Give a minimal diagnostic sequence.
answer_contract:
  format: human_explanation_plus_json_object
  schema_id: pilot_answer_v0.1
  required_result_paths:
  - answers.q1.causes
  - answers.q2.classifications
  - answers.q3.steps
  permit_additional_explanation: true
  method_shape:
    answers.q1.causes: Array of {id,family,mechanism,fault_class,prediction:{test,outcome}}. Count distinct
      physical fault families, not synonyms. Known family/process/test codes are in tools/scorers/diagnostic_vnext.py.
    answers.q2.classifications: Array of {cause_id,fault_class,corrective_action}. Link every q1 cause
      to procedure/iterate_near_far or hardware/correct_physical_limit.
    answers.q3.steps: Ordered array of {test,target_cause_ids,controls,if_present,if_absent,conclusions:{supports_if_present,weakens_if_absent}}.
      Test outcomes must distinguish the linked causes; begin with a non-invasive observation.
  notes: The bounded typed scorer evaluates explicit causal links. Unknown plausible fault processes or
    methods yield unresolved, not a categorical failure; unstructured prose cannot establish a scored
    claim.
gold:
  universal_constraints:
  - id: c_q1
    severity: scored
    predicate: Identify at least four distinct physically plausible causes. Examples include aperture
      placement relative to the intended reference axis, limited mirror travel or degrees of freedom,
      mount drift, beam-height mismatch, and clipping; no particular example is mandatory. Do not call
      two arbitrary aperture centers non-collinear with each other.
    evidence_path: answers.q1
  - id: c_q2
    severity: scored
    predicate: Distinguish a procedure that can be corrected by iterative near/far adjustment from a reference-axis,
      reachability, stability, or clear-aperture problem that requires physical correction.
    evidence_path: answers.q2
  - id: c_q3
    severity: scored
    predicate: Verify the two aperture centers against the intended reference line, check mirror reach
      and clear apertures, then iteratively center near and far apertures while observing whether changes
      converge.
    evidence_path: answers.q3
  other_valid_families_policy: Listed examples are illustrative, not a closed whitelist; accept physically
    equivalent approaches satisfying the stated observable and constraints.
scoring:
  criteria:
  - id: c_q1
    weight: 0.3333333333333333
    check: c_q1
  - id: c_q2
