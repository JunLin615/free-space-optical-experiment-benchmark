schema_version: 0.1.0
case_id: SEED-2-1
legacy_id: '2.1'
case_revision: 0.3.0
benchmark_release: 0.2.0-rc1
validation_status: release_verified
split: public_eval
title: Diffraction-limited focus scale
language: en
taxonomy:
  optical_domain: gaussian_beams
  task_types:
  - quantitative_inference
  - conceptual_reasoning
  difficulty_hypothesis: introductory
  modality: text
provenance:
  origin: user_supplied_chinese_html_seed
  source_hash: 077DB14D2A5C67A3123C82AF1D571F8FFA73D3C79501C7C9D8C99E021C2318A8
  seed_relationship: Translation and clarification of case 2.1 in the original 64-case HTML seed; supersedes
    canonical revision 0.2.1 only in the new evaluator lineage.
  created_utc: '2026-09-28'
  source_references: []
  derivation: The ideal collimated Gaussian relation gives a 16.93 um waist. Revision 0.3.0 separates
    a numerical estimate in q1 from the explicitly order-scale choice in q2. The former admits one-significant-figure
    reporting; the latter admits the offered 10 um choice.
  license_status: CC-BY-4.0 (project benchmark content)
task:
  statement: An approximately collimated Gaussian beam at 532 nm enters a thin lens of focal length 100
    mm. Its 1/e² intensity radius at the lens is about 1.0 mm, and the lens aperture is sufficiently large.
    Use the ideal diffraction-limited Gaussian relation for the numerical estimate.
  questions:
  - id: q1
    request: Estimate the diffraction-limited 1/e² waist radius numerically. Reporting to one significant
      figure is sufficient.
  - id: q2
    request: State whether the estimate is closer to 1 μm, 10 μm, or 1 mm.
  - id: q3
    request: If the incident beam radius doubles and other conditions stay fixed, how does the ideal waist
      radius change?
  givens:
  - value: 532
    unit: nm
    symbol: wavelength
  - value: 100
    unit: mm
    symbol: focal_length
  - value: 1.0
    unit: mm
    symbol: incident_radius
    definition: 1/e^2 intensity radius
answer_contract:
  format: human_explanation_plus_json_object
  schema_id: pilot_answer_v0.1
  required_result_paths:
  - answers.q1.waist_radius
  - answers.q2.closest_scale
  - answers.q3.waist_radius_factor
  quantity_shape:
    answers.q1.waist_radius: Quantity {value, unit}; numerical diffraction-limited 1/e² intensity radius.
    answers.q2.closest_scale: Quantity {value, unit}; select one of 1 um, 10 um, or 1 mm.
    answers.q3.waist_radius_factor: 'Dimensionless quantity {value, unit: 1}; new/old ideal waist-radius
      ratio.'
  method_shape:
    q3: State the ideal new/old waist-radius factor at fixed wavelength and focal length.
  permit_additional_explanation: true
gold:
  reference_model:
    equation: w0 ≈ λf/(πw_lens)
    valid_if: collimated diffraction-limited Gaussian beam and negligible aperture clipping
  numerical_checks:
  - id: n_waist
    answer_path: answers.q1.waist_radius
    reference:
      value: 16.93
      unit: um
    absolute_tolerance:
      value: 3.386
      unit: um
    relative_tolerance: 0.2
    comparator: max_abs_or_relative_inclusive
    validator_id: gaussian_focus_radius
    tolerance_rationale: A 20% reporting tolerance accepts the one-significant-figure value 20 um (18.1%
      above 16.93 um), as well as more precise estimates. It is not a measurement uncertainty. It excludes
      a bare 10 um decade label from q1; that order-scale response belongs in q2. The 20% relative component
      preserves this rule when givens are validly mutated.
  universal_constraints:
  - id: c_scale
    severity: scored
    predicate: Among the three choices, 10 micrometers is closest
    evidence_path: answers.q2.closest_scale
  - id: c_double
    severity: scored
    predicate: Doubling incident beam radius approximately halves ideal waist radius
    evidence_path: answers.q3.waist_radius_factor
  known_failure_modes:
  - An M² qualification is physically valid; it should not be marked wrong when the ideal reference is
    stated.
scoring:
  criteria:
  - id: n_waist
    weight: 0.5
    check: n_waist
  - id: c_scale
    weight: 0.2
    check: c_scale
  - id: c_double
    weight: 0.3
    check: c_double
  hard_rule: No score cap is proposed for this draft case; retain all criterion outcomes.
  malformed_answer_rule: Missing or invalid structured paths score zero for dependent criteria; preserve
    the parse error.
  aggregation: weighted_sum_then_hard_cap
validation:
  planned_checks:
  - yaml_and_json_schema_valid
  - all_scoring_ids_resolve_and_weights_sum_to_one
  - independent_physics_review
  - positive_and_adversarial_answer_fixtures_pass
  implemented_checks:
  - independent_gaussian_q_parameter_crosscheck
  - unit_aware_numerical_oracle
  - typed_scale_and_ratio_oracles
  - vnext_reporting_tolerance_boundary_tests
  notes: Coordinator-reviewed vNext contract; all scored tasks have deterministic verdicts and every release
    fixture resolves. See docs/release_vnext.md for scope and residual risks.
  independent_derivation: Fourier transform of a collimated Gaussian gives w0 = lambda f/(pi w_lens),
    approximately 16.93 um. Doubling w_lens halves w0 at fixed wavelength and focal length. The q-parameter
    calculation supplies an independent finite-curvature cross-check.
  evidence_files:
  - tests/test_vnext_deterministic_evidence.py
  positive_fixtures:
  - benchmark/fixtures_vnext/SEED-2-1/alternative_valid_rounded_estimate.json
  - benchmark/fixtures_vnext/SEED-2-1/alternative_valid_units.json
  - benchmark/fixtures_vnext/SEED-2-1/boundary_inclusive_ratio.json
  - benchmark/fixtures_vnext/SEED-2-1/boundary_inclusive_waist.json
  - benchmark/fixtures_vnext/SEED-2-1/positive_reference.json
  - benchmark/fixtures_vnext/SEED-2-1/positive_rounded_17um.json
  negative_fixtures:
  - benchmark/fixtures_vnext/SEED-2-1/adversarial_unjustified_beam_quality.json
  - benchmark/fixtures_vnext/SEED-2-1/adversarial_wrong_scaling.json
  - benchmark/fixtures_vnext/SEED-2-1/negative_decade_only_q1.json
  - benchmark/fixtures_vnext/SEED-2-1/negative_factor_two_waist.json
  - benchmark/fixtures_vnext/SEED-2-1/negative_waist_unchanged.json
  - benchmark/fixtures_vnext/SEED-2-1/negative_wrong_dimension.json
  - benchmark/fixtures_vnext/SEED-2-1/negative_wrong_scale_choice.json
  adversarial_evidence: benchmark/fixtures_vnext/SEED-2-1/adversarial_* and negative_* challenge distinct
    physical errors under the versioned answer contract.
