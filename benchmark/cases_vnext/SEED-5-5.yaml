schema_version: 0.1.0
case_id: SEED-5-5
legacy_id: '5.5'
case_revision: 0.3.0
benchmark_release: 0.2.0-rc1
validation_status: release_verified
split: public_eval
title: Optical heterodyne beat
language: en
taxonomy:
  optical_domain: weak_signal_detection
  task_types:
  - quantitative_inference
  - conceptual_reasoning
  difficulty_hypothesis: intermediate
  modality: text
provenance:
  origin: user_supplied_chinese_html_seed
  source_hash: 077DB14D2A5C67A3123C82AF1D571F8FFA73D3C79501C7C9D8C99E021C2318A8
  seed_relationship: Translation of case 5.5 in the original 64-case HTML seed. Revision 0.3.0 clarifies
    machine-readable claims only in the new release lineage.
  created_utc: '2026-09-28'
  source_references: []
  derivation: The 80 MHz value is retained. The ideal orthogonal-polarization limit is stated separately
    from practical leakage. Revision 0.2.0 defines typed fields for closed-physics autonomous scoring
    while preserving the public scientific questions. Revision 0.2.1 removes an unasked projection claim
    from the required q3 answer; only the no-projector result is scored. Revision 0.3.0 bounds the JSON
    answer vocabulary to physical state claims while retaining free explanatory prose.
  license_status: CC-BY-4.0 (project benchmark content)
task:
  statement: Signal light has optical frequency f0. A local-oscillator beam has frequency f0 + 80 MHz.
    The beams have matching polarization and good spatial overlap on a photodetector fast enough to resolve
    their beat.
  questions:
  - id: q1
    request: What is the key new electrical frequency component?
  - id: q2
    request: Explain the physical origin of this component.
  - id: q3
    request: Predict what happens if the beams instead have orthogonal polarizations and there is no polarization
      projector before the detector.
  givens:
  - symbol: lo_frequency_offset
    value: 80
    unit: MHz
answer_contract:
  format: human_explanation_plus_json_object
  schema_id: pilot_answer_v0.1
  required_result_paths:
  - answers.q1.beat_frequency
  - answers.q2.detector_field_response_order
  - answers.q2.frequency_component_source
  - answers.q3.ideal_cross_term
  method_shape:
    q1: 'Object containing beat_frequency: quantity {value, unit}.'
    q2: 'Object with detector_field_response_order: dimensionless Quantity {value, unit}, giving the electric-field
      response order; and frequency_component_source enum self_term|interference_cross_term|optical_carrier.
      Equivalent explanatory wording may be provided outside the scored JSON object.'
    q3: 'Object with ideal_cross_term: false for the stated no-projector condition; optional practical-leakage
      qualification. A possible beat-restoring projection is context, not required or scored.'
  permit_additional_explanation: true
  quantity_shape:
    answers.q1.beat_frequency: Quantity {value, unit}; convertible frequency units accepted.
    answers.q2.detector_field_response_order: Dimensionless Quantity {value, unit}; electric-field response
      order of the photodetector signal.
gold:
  visibility: private
  universal_constraints:
  - id: c_q2
    severity: scored
    predicate: Derive the beat from the cross term in the square-law response to overlapping electric
      fields.
    evidence_path: answers.q2
  - id: c_q3
    severity: scored
    predicate: For ideal orthogonal states without projection, identify a vanishing interference cross
      term; practical residuals may remain with imperfect orthogonality.
    evidence_path: answers.q3
  accepted_solution_families:
  - id: direct_overlap
    example: Overlap the two matching-polarization beams directly on a sufficiently fast photodiode.
  - id: polarization_projection
    example: For initially orthogonal inputs, use an explicit common polarization projection before photodetection
      to restore a beat at a throughput cost.
  other_valid_families_policy: Other heterodyne readouts are valid if they preserve coherent mode overlap
    and correctly identify the difference-frequency term.
  forbidden_claims:
  - id: f_1
    predicate: Ideal orthogonal polarizations produce the same beat without any polarization projection
      or mixing.
  numerical_checks:
  - id: n_result
    answer_path: answers.q1.beat_frequency
    reference:
      value: 80.0
      unit: MHz
    absolute_tolerance:
      value: 1.0
      unit: MHz
    comparator: absolute_inclusive
    tolerance_rationale: Allows normal rounding; this is a scoring tolerance, not an instrument uncertainty.
    validator_id: heterodyne_beat
    inputs:
    - lo_frequency_offset
scoring:
  criteria:
  - id: n_result
    weight: 0.33333333
    check: n_result
    question_id: q1
  - id: c_q2
    weight: 0.33333333
    check: c_q2
    question_id: q2
  - id: c_q3
    weight: 0.33333334
    check: c_q3
    question_id: q3
  hard_rule: No score cap is proposed for this draft case; retain all criterion outcomes.
  malformed_answer_rule: Missing or invalid structured paths score zero for dependent criteria; preserve
    the parse error.
  aggregation: weighted_sum_then_hard_cap
validation:
  planned_checks:
  - yaml_and_json_schema_valid
  - independent_physics_review
  - unit_aware_numerical_check
  - positive_and_adversarial_answer_fixtures_pass
  - calibrated_bounded_semantic_review_for_explanations
  implemented_checks:
  - independent_unit_aware_numeric_oracle
  - bounded_structured_physics_oracle
  notes: Coordinator-reviewed vNext contract; all scored tasks have deterministic verdicts and every release
    fixture resolves. See docs/release_vnext.md for scope and residual risks.
  positive_fixtures:
  - benchmark/fixtures_vnext/SEED-5-5/alternative_hz_units.json
  - benchmark/fixtures_vnext/SEED-5-5/alternative_khz_units.json
  - benchmark/fixtures_vnext/SEED-5-5/boundary_frequency_tolerance.json
  - benchmark/fixtures_vnext/SEED-5-5/boundary_projector_context.json
  - benchmark/fixtures_vnext/SEED-5-5/positive_ghz_units.json
  - benchmark/fixtures_vnext/SEED-5-5/positive_reference.json
  negative_fixtures:
  - benchmark/fixtures_vnext/SEED-5-5/adversarial_polished_wrong_detector.json
  - benchmark/fixtures_vnext/SEED-5-5/adversarial_polished_wrong_origin.json
  - benchmark/fixtures_vnext/SEED-5-5/negative_half_frequency.json
  - benchmark/fixtures_vnext/SEED-5-5/negative_linear_response.json
  - benchmark/fixtures_vnext/SEED-5-5/negative_orthogonal_cross_term.json
  - benchmark/fixtures_vnext/SEED-5-5/negative_self_term_origin.json
  independent_derivation: Independent ray-matrix, Gaussian-scaling, thin-lens, Rayleigh, and field-interference
    constructions in tests/test_closed_physics.py, as applicable.
  adversarial_evidence: benchmark/fixtures_vnext/SEED-5-5/adversarial_* and negative_* challenge distinct
    physical errors under the versioned answer contract.
  evidence_files:
  - tests/test_vnext_deterministic_evidence.py
