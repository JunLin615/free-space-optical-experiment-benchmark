  derivation: 'Translated the original seed prompt and answer outline. Clarification: an approximate diameter
    is ambiguous for unknown beam quality, so require one stated width convention for input and output
    and independent modal characterization; example pass/fail limits are illustrative, not imposed universal
    thresholds.'
  license_status: CC-BY-4.0 (project benchmark content)
task:
  statement: On a free-space platform, prepare an approximately collimated, clean-spatial-mode, high-linear-polarization-purity
    633 nm beam for high-contrast interferometry. The target beam diameter is about 8 mm and the input
    diameter about 1 mm; input mode quality is unknown. State the beam-width convention used for both
    values.
  questions:
  - id: q1
    request: Design a complete conditioning chain.
  - id: q2
    request: Identify input properties that must be measured before choosing components.
  - id: q3
    request: List final acceptance measurements and methods.
  - id: q4
    request: Give one quantitative pass/fail rule with stated measurement conditions.
answer_contract:
  format: human_explanation_plus_json_object
  schema_id: pilot_answer_v0.1
  required_result_paths:
  - answers.q1
  - answers.q2
  - answers.q3
  - answers.q4
  permit_additional_explanation: true
gold:
  universal_constraints:
  - id: c_q1
    severity: scored
    predicate: Cover input characterization, pointing, polarization preparation, expansion or filtering,
      collimation, and a final output reference axis without prescribing one vendor or topology.
    evidence_path: answers.q1
  - id: c_q2
    severity: scored
    predicate: Measure or verify width convention, propagation or divergence, M² or modal quality, polarization
      state, power and damage-relevant levels rather than assuming a diffraction-limited input.
    evidence_path: answers.q2
  - id: c_q3
    severity: scored
    predicate: Measure beam width, divergence or collimation, near/far-field profile, pointing stability,
      polarization extinction, and interferometric visibility where relevant.
    evidence_path: answers.q3
  - id: c_q4
    severity: scored
    predicate: State at least one numerical tolerance under named planes, distance, averaging or bandwidth,
      and measurement method; do not claim the example tolerance is universal.
    evidence_path: answers.q4
  other_valid_families_policy: Listed examples are illustrative, not a closed whitelist; accept physically
    equivalent approaches satisfying the stated observable and constraints.
  accepted_solution_families:
  - id: refractive_expander
    example: A refractive telescope with a justified spatial filter and polarization preparation produces
      the target beam.
  - id: reflective_expander
    example: A reflective expansion and cleanup chain provides an alternative chromatic or power-handling
      path.
  - id: measured_acceptance
    example: Any topology is acceptable if its final beam meets independently measured width, divergence,
      mode, pointing, and polarization criteria.
scoring:
  criteria:
