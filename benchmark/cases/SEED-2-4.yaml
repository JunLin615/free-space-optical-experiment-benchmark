  source_references: []
  derivation: >-
    Translates the seed's radius-scaling question. The fourfold Rayleigh-range
    and half-divergence results require fixed wavelength and unchanged beam
    quality; the latter is made explicit for a well-posed comparison.
  license_status: CC-BY-4.0 (project benchmark content)
task:
  statement: >-
    A Gaussian beam waist has 1/e² intensity radius 50 μm. A redesigned
    free-space optical path increases the waist radius to 100 μm at the same
    wavelength and beam quality.
  questions:
  - id: q1
    request: By what factor does the Rayleigh range change?
  - id: q2
    request: By what factor does the far-field half-angle divergence change?
  - id: q3
    request: Explain why a larger waist is not preferable for every application.
  givens:
  - {symbol: initial_waist_radius, value: 50, unit: um, definition: 1/e^2 intensity radius}
  - {symbol: final_waist_radius, value: 100, unit: um, definition: 1/e^2 intensity radius}
answer_contract:
  format: human_explanation_plus_json_object
  schema_id: pilot_answer_v0.1
  required_result_paths: [answers.q1, answers.q2, answers.q3]
  permit_additional_explanation: true
gold:
  reference_model:
    equation: z_R = πw_0²/λ and θ = λ/(πw_0) for ideal Gaussian beams; fixed M² retains the same scaling.
    valid_if: Wavelength and beam quality remain unchanged.
  universal_constraints:
  - id: c_rayleigh
    severity: scored
    predicate: Doubling the waist radius increases Rayleigh range by a factor of four.
    evidence_path: answers.q1
  - id: c_divergence
    severity: scored
    predicate: Doubling the waist radius reduces the far-field half-angle divergence by a factor of two.
    evidence_path: answers.q2
  - id: c_tradeoff
    severity: scored
    predicate: A larger waist reduces peak intensity and extends depth of focus but worsens local spatial resolution and demands more clear aperture.
    evidence_path: answers.q3
  forbidden_claims:
  - id: f_all_better
    predicate: Increasing waist size improves intensity, resolution, depth of focus, and aperture demand simultaneously.
scoring:
  criteria:
  - {id: c_rayleigh, weight: 0.35, check: c_rayleigh, question_id: q1}
  - {id: c_divergence, weight: 0.35, check: c_divergence, question_id: q2}
  - {id: c_tradeoff, weight: 0.3, check: c_tradeoff, question_id: q3}
  hard_rule: No score cap is proposed for this draft case; retain all criterion outcomes.
  malformed_answer_rule: Missing or invalid structured paths score zero for dependent criteria; preserve the parse error.
  aggregation: weighted_sum_then_hard_cap
validation:
  planned_checks: [yaml_and_json_schema_valid, all_scoring_ids_resolve_and_weights_sum_to_one, independent_physics_review, positive_and_adversarial_answer_fixtures_pass, Gaussian_scaling_validator]
