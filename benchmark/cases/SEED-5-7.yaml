  created_utc: '2026-09-28'
  source_references: []
  derivation: 'Material clarification: the seed says differential noise stops falling without defining its
    normalization. This version specifies rms differential current referred to mean photocurrent in fixed bandwidth;
    ideal absolute and fractional shot-noise trends are both requested. Revision 0.1.1 separates noise-budget
    terms from actual causes of a high-power fractional-noise plateau.'
  license_status: CC-BY-4.0 (project benchmark content)
task:
  statement: Balanced photodetection has strongly suppressed common laser relative-intensity noise. At fixed
    electrical measurement bandwidth, the rms differential noise normalized to the mean photocurrent initially
    improves as power rises, but its improvement later stalls.
  questions:
  - id: q1
    request: List noise mechanisms or nonidealities that could now dominate and describe how to distinguish
      them.
  - id: q2
    request: State how ideal shot-noise rms current and fractional shot noise scale with mean optical power
      at fixed bandwidth and responsivity.
  - id: q3
    request: Identify limits imposed by further power increases.
answer_contract:
  format: human_explanation_plus_json_object
  schema_id: pilot_answer_v0.1
  required_result_paths:
  - answers.q1
  - answers.q2
  - answers.q3
  method_shape:
    q1: Object with noise_sources and discriminating_controls or power_scaling.
    q2: Object with absolute_rms_scaling and fractional_rms_scaling at fixed bandwidth.
    q3: Object with high_power_limits and predicted measurement effects.
  permit_additional_explanation: true
gold:
  visibility: private
  universal_constraints:
  - id: c_q1
    severity: scored
    predicate: Distinguish noise-budget terms from plateau mechanisms. Fixed-bandwidth electronic or dark
      noise falls fractionally as 1/P, and ideal shot noise falls as 1/sqrt(P); neither alone produces a
      high-power fractional plateau. Residual technical relative-intensity noise, imbalance, nonlinear
      gain or saturation, or a changing effective bandwidth can flatten the trend. Use power scaling and
      dark, blocked-light, and balance controls to discriminate them.
    evidence_path: answers.q1
  - id: c_q2
    severity: scored
    predicate: At fixed bandwidth and responsivity, state absolute shot-noise rms current proportional to square
      root of photocurrent or power, while the fractional value falls as inverse square root of power.
    evidence_path: answers.q2
  - id: c_q3
    severity: scored
    predicate: Identify saturation, nonlinearity, heating or drift, and optical or detector damage as possible
      high-power limits.
    evidence_path: answers.q3
  accepted_solution_families:
  - id: scaling_scan
    example: Measure differential noise versus power in a fixed bandwidth, with both-beams, one-beam, and dark
      controls.
  - id: calibrated_noise_budget
    example: Calibrate electronic, shot, and residual technical-noise terms from independently measured current
      and detector transfer functions.
  other_valid_families_policy: Equivalent diagnostics pass if they define the reported noise quantity and bandwidth
    and separate absolute from fractional scaling.
  forbidden_claims:
  - id: f_1
    predicate: Absolute shot-noise current decreases as optical power increases at fixed bandwidth.
  - id: f_2
    predicate: The normalized difference must keep improving indefinitely with optical power.
  - id: f_3
    predicate: Ideal shot noise by itself creates a power-independent plateau in fractional rms noise at fixed
      electrical bandwidth.
