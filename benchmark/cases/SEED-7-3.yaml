task:
  statement: Each arm of a two-arm interferometer makes a clear spot on the camera separately, but recombining
    them produces only shallow fringes.
  questions:
  - id: q1
    request: List at least six distinct causes of low visibility.
  - id: q2
    request: Prioritize diagnostic checks.
  - id: q3
    request: Explain why overlapping camera spots are insufficient.
answer_contract:
  format: human_explanation_plus_json_object
  schema_id: pilot_answer_v0.1
  required_result_paths:
  - answers.q1
  - answers.q2
  - answers.q3
  permit_additional_explanation: true
gold:
  universal_constraints:
  - id: c_q1
    severity: scored
    predicate: Cover distinct effects such as polarization mismatch, path difference beyond coherence
      length, wavefront mismatch, excessive crossing angle, spatial-mode mismatch, intensity imbalance,
      and frequency or pulse-timing mismatch.
    evidence_path: answers.q1
  - id: c_q2
    severity: scored
    predicate: Start with both beams and detector linearity and intensity balance, then test polarization,
      temporal or path coherence, angle, and wavefront overlap with controlled changes.
    evidence_path: answers.q2
  - id: c_q3
    severity: scored
    predicate: Explain that spatial overlap at one camera plane does not establish matching polarization,
      phase coherence, wavefront, angular direction, or temporal overlap.
    evidence_path: answers.q3
  other_valid_families_policy: Listed examples are illustrative, not a closed whitelist; accept physically
    equivalent approaches satisfying the stated observable and constraints.
