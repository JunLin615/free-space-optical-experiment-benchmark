task:
  statement: A beam-expander module is labeled 5×. Verify its optical performance independently rather
    than reading the focal-length labels.
  questions:
  - id: q1
    request: Propose at least two independent experimental measurements.
  - id: q2
    request: Explain how to handle imperfect input or output collimation.
  - id: q3
    request: Define acceptance quantities.
answer_contract:
  format: human_explanation_plus_json_object
  schema_id: pilot_answer_v0.1
  required_result_paths:
  - answers.q1
  - answers.q2
  - answers.q3
  permit_additional_explanation: true
gold:
  universal_constraints:
  - id: c_q1
    severity: scored
    predicate: Use independent beam-size measurements, such as a beam profiler and knife-edge scan, or
      combine measured propagation and divergence with beam-size measurements; identify the beam-width
      convention.
    evidence_path: answers.q1
  - id: c_q2
    severity: scored
    predicate: Measure at multiple axial positions and fit propagation or otherwise compare equivalent
      beam planes; a single local width ratio is not a reliable afocal magnification for converging or
      diverging beams.
    evidence_path: answers.q2
  - id: c_q3
    severity: scored
    predicate: Report a measured diameter or radius ratio under one convention, residual output convergence
      or divergence, and horizontal/vertical behavior with stated uncertainty or tolerance.
    evidence_path: answers.q3
  other_valid_families_policy: Listed examples are illustrative, not a closed whitelist; accept physically
