  derivation: English translation of the seed's spatial-mode diagnosis; narrow resonance peaks do not exclude all frequency noise but make spatial mismatch the priority.
  license_status: CC-BY-4.0 (project benchmark content)
task:
  statement: >-
    A laser is coupled into a stable free-space optical cavity. Scanning laser
    frequency reveals prominent higher-order transverse-mode resonances in
    addition to the fundamental mode. The resonance peaks themselves are
    sufficiently narrow.
  questions:
  - id: q1
    request: Which should be investigated first, frequency linewidth or spatial mode matching, and why?
  - id: q2
    request: Name at least three distinct spatial parameters that need matching to the cavity mode.
  - id: q3
    request: Propose an adjustment and measurement sequence to improve fundamental-mode coupling.
answer_contract:
  format: human_explanation_plus_json_object
  schema_id: pilot_answer_v0.1
  required_result_paths: [answers.q1, answers.q2, answers.q3]
  permit_additional_explanation: true
gold:
  universal_constraints:
  - id: c_priority
    severity: scored
    predicate: Prioritize beam alignment and spatial mode matching; visible higher-order resonances indicate overlap with unwanted transverse cavity modes.
    evidence_path: answers.q1
  - id: c_parameters
    severity: scored
    predicate: >-
      Name at least three genuinely distinct quantities among beam waist size,
      waist location/wavefront curvature, transverse position, and propagation
      direction; waist location and curvature may represent the same q-parameter
      degree of freedom rather than two independent categories.
    evidence_path: answers.q2
  - id: c_sequence
    severity: scored
    predicate: >-
      Establish geometric alignment, adjust mode-matching optics for the cavity
      Gaussian q parameter, then monitor fundamental-to-higher-mode coupling
      as an empirical acceptance measure.
    evidence_path: answers.q3
  accepted_solution_families:
  - id: alignment_then_lenses
    example: Align beam axis to the cavity, tune a lens pair to match waist size and location, and monitor the TEM00 coupling fraction.
  - id: measured_mode_overlap
    example: Measure cavity mode geometry and incident beam propagation, correct transverse axis and q-parameter mismatch, and rescan the mode spectrum.
  other_valid_families_policy: Accept equivalent diagnostics that distinguish alignment, waist, and curvature errors with measured mode-coupling evidence.
  known_failure_modes:
  - Frequency tuning may move resonance positions but does not by itself eliminate spatial overlap with higher-order modes.
scoring:
  criteria:
  - {id: c_priority, weight: 0.3, check: c_priority, question_id: q1}
  - {id: c_parameters, weight: 0.35, check: c_parameters, question_id: q2}
  - {id: c_sequence, weight: 0.35, check: c_sequence, question_id: q3}
  hard_rule: No score cap is proposed for this draft case; retain all criterion outcomes.
  malformed_answer_rule: Missing or invalid structured paths score zero for dependent criteria; preserve the parse error.
  aggregation: weighted_sum_then_hard_cap
validation:
  planned_checks: [yaml_and_json_schema_valid, all_scoring_ids_resolve_and_weights_sum_to_one, independent_physics_review, positive_and_adversarial_answer_fixtures_pass, calibrated_semantic_judge]
  implemented_checks: []
  notes: Counting three distinct spatial categories needs a tested semantic or structured oracle; none is implemented.
