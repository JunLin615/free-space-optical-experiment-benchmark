  - answers.q3
  permit_additional_explanation: true
gold:
  universal_constraints:
  - id: c_q1
    severity: scored
    predicate: Identify at least four distinct causes, including possible incorrect aperture placement
      relative to the intended reference axis, limited mirror travel or degrees of freedom, mount drift,
      beam-height mismatch, and clipping; do not call two arbitrary aperture centers non-collinear with
      each other.
    evidence_path: answers.q1
  - id: c_q2
    severity: scored
    predicate: Distinguish a procedure that can be corrected by iterative near/far adjustment from a reference-axis,
      reachability, stability, or clear-aperture problem that requires physical correction.
    evidence_path: answers.q2
  - id: c_q3
    severity: scored
    predicate: Verify the two aperture centers against the intended reference line, check mirror reach
      and clear apertures, then iteratively center near and far apertures while observing whether changes
      converge.
    evidence_path: answers.q3
