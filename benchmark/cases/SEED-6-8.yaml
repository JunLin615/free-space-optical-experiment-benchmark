benchmark_release: null
validation_status: specified
split: public_dev
title: Joint phase and intensity measurement
language: en
taxonomy:
  optical_domain: interferometry
  task_types:
  - experimental_design
  - error_analysis
  difficulty_hypothesis: advanced
  modality: text
provenance:
  origin: user_supplied_chinese_html_seed
  source_hash: 077DB14D2A5C67A3123C82AF1D571F8FFA73D3C79501C7C9D8C99E021C2318A8
  seed_relationship: Translation of case 6.8 in the original 64-case HTML seed.
  created_utc: '2026-09-28'
  source_references: []
  derivation: The seed lists phase-shifting and heterodyne approaches. This translation explicitly requires
    sufficient independent observables for complex-field recovery.
  license_status: CC-BY-4.0 (project benchmark content)
task:
  statement: A sample induces both weak absorption and a small phase shift. Obtain both observables in as nearly
    the same experimental run as practical.
  questions:
  - id: q1
    request: Propose a free-space interferometric measurement.
  - id: q2
    request: Explain how the observables separately determine amplitude or transmission and phase.
  - id: q3
    request: Identify at least two nonidealities that couple the inferred amplitude and phase.
answer_contract:
  format: human_explanation_plus_json_object
  schema_id: pilot_answer_v0.1
  required_result_paths:
  - answers.q1
  - answers.q2
  - answers.q3
  method_shape:
    q1: Object with sample_field, reference_field, phase_diversity method, and detector readout.
    q2: Object with amplitude_observable, phase_observable, and reference calibration.
    q3: 'Object with cross_talk_sources: array of at least two distinct mechanisms.'
  permit_additional_explanation: true
gold:
  visibility: private
  universal_constraints:
  - id: c_q1
    severity: scored
    predicate: Place a sample-affected field and calibrated reference field in an interferometric readout with
      phase diversity, phase stepping, or heterodyne quadratures sufficient to recover complex field change.
    evidence_path: answers.q1
  - id: c_q2
    severity: scored
    predicate: Separate field magnitude or calibrated transmission from fringe phase or quadrature angle; account
      for reference intensity and baseline so one intensity sample is not treated as a unique complex-field
      measurement.
    evidence_path: answers.q2
  - id: c_q3
    severity: scored
    predicate: Identify at least two distinct cross-talk mechanisms such as detector nonlinearity, polarization
      or spatial-mode mismatch, reference-power or visibility drift, and path-phase drift.
    evidence_path: answers.q3
  accepted_solution_families:
  - id: phase_stepping
    example: Acquire several known reference phases and solve jointly for sample-field magnitude and phase.
  - id: heterodyne_iq
    example: Use a shifted reference and calibrated in-phase and quadrature demodulation.
  - id: parallel_phase_diversity
    example: Collect simultaneous spatial or polarization phase-diverse channels with calibrated gains and
      reference phase.
  other_valid_families_policy: Any method that obtains two independent calibrated field observables and bounds
    cross-talk is valid, including simultaneous or fast interleaved sampling.
  forbidden_claims:
  - id: f_1
    predicate: Infer an arbitrary amplitude and phase change uniquely from a single uncalibrated intensity
      value.
scoring:
  criteria:
  - id: c_q1
    weight: 0.33333333
    check: c_q1
    question_id: q1
  - id: c_q2
    weight: 0.33333333
    check: c_q2
    question_id: q2
  - id: c_q3
    weight: 0.33333334
    check: c_q3
    question_id: q3
  hard_rule: No score cap is proposed for this draft case; retain all criterion outcomes.
  malformed_answer_rule: Missing or invalid structured paths score zero for dependent criteria; preserve the
    parse error.
  aggregation: weighted_sum_then_hard_cap
validation:
  planned_checks:
  - yaml_and_json_schema_valid
  - independent_physics_review
  - positive_and_adversarial_answer_fixtures_pass
  - calibrated_bounded_semantic_review_for_explanations
  implemented_checks: []
  notes: Draft specification only. The answer criteria are proposed, not an implemented autonomous scorer;
    positive and adversarial fixtures and semantic calibration are still required before promotion.
