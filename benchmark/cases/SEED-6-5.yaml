  derivation: The seed emphasizes confocal conjugacy. The translation also allows either sample motion or focal-plane
    scanning while requiring the same optical relationship.
  license_status: CC-BY-4.0 (project benchmark content)
task:
  statement: Fluorescence inside a transparent sample must be scanned at different depths while suppressing
    out-of-focus background.
  questions:
  - id: q1
    request: Design the confocal excitation and collection path.
  - id: q2
    request: State which conjugate relationship must be maintained during depth scanning.
  - id: q3
    request: Describe the tradeoff between pinhole size, signal, and axial selectivity.
answer_contract:
  format: human_explanation_plus_json_object
  schema_id: pilot_answer_v0.1
  required_result_paths:
  - answers.q1
  - answers.q2
  - answers.q3
  method_shape:
    q1: Object with excitation_focus, collection, spectral_separation, pinhole_imaging, and detector.
    q2: Object with scan_method and maintained focal-volume-to-pinhole conjugacy.
    q3: Object with pinhole_size, throughput, axial_selectivity, and alignment tradeoff.
  permit_additional_explanation: true
gold:
  visibility: private
  universal_constraints:
  - id: c_q1
    severity: scored
    predicate: Focus excitation and collect fluorescence with appropriate objectives; spectrally separate excitation
      from fluorescence and image the selected sample volume onto a detection pinhole and detector.
    evidence_path: answers.q1
  - id: c_q2
    severity: scored
    predicate: Keep the selected object-space focal volume conjugate to the detection pinhole during sample
      or focus scanning, including any required refocusing for refractive-index mismatch.
    evidence_path: answers.q2
  - id: c_q3
    severity: scored
    predicate: Explain that a smaller pinhole often improves optical sectioning but reduces photon throughput
      and raises alignment or aberration sensitivity.
    evidence_path: answers.q3
  accepted_solution_families:
  - id: sample_scan
    example: Keep optics and pinhole fixed while moving the transparent sample through focus.
  - id: focus_scan
    example: Shift the focal plane with an appropriately relayed objective or scan optic and preserve pinhole
      conjugacy.
  other_valid_families_policy: Other scan schemes pass if they maintain or recalibrate sample-volume to pinhole
    imaging across depth and quantify their collection tradeoff.
  forbidden_claims:
  - id: f_1
    predicate: The pinhole can remain arbitrarily mis-conjugated during scanning without affecting sectioning.
scoring:
