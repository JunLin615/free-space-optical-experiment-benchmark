case_revision: 0.1.4
benchmark_release: null
validation_status: challenged
split: public_dev
title: Folded optical delay line
language: en
taxonomy:
  optical_domain: ultrafast_optics
  task_types:
  - quantitative_inference
  difficulty_hypothesis: introductory
  modality: text
provenance:
  origin: user_supplied_chinese_html_seed
  source_hash: 077DB14D2A5C67A3123C82AF1D571F8FFA73D3C79501C7C9D8C99E021C2318A8
  seed_relationship: Translation of case 1.5 in the original 64-case HTML seed.
  created_utc: '2026-09-28'
  source_references: []
  derivation: English translation of the original seed prompt and tasks. Revision 0.1.1 documents scoring tolerances and independent path construction without changing the scientific question. Revision 0.1.2 states magnitude conventions because stage motion direction is unspecified. Revision 0.1.3 clarifies that optional explanation is retained for audit without adding a scoring criterion. Revision 0.1.4 states the two moving-gap traversals that make the seed's double-pass calculation unambiguous.
  license_status: CC-BY-4.0 (project benchmark content)
task:
  coordinate_convention: Path and time changes are magnitudes because the stage-motion sense was not given; required mechanical travel is nonnegative.
  statement: An ultrashort pulse enters a straight folded delay line with two reflections. The translation
    stage carrying the retroreflecting mirror group moves 1.00 mm along the optical axis. The beam traverses
    the moving-stage gap once on the outbound leg and once on the return leg; no other moving path segment
    changes. Report changes in optical path and time delay as magnitudes.
  questions:
  - id: q1
    request: Find the change in optical path length.
  - id: q2
    request: Find the change in time delay.
  - id: q3
    request: Estimate the required one-way mechanical travel for a 100 ps delay scan.
  givens:
  - value: 1.0
    unit: mm
    symbol: stage_displacement
  - value: 100
    unit: ps
    symbol: target_delay
answer_contract:
  format: human_explanation_plus_json_object
  schema_id: pilot_answer_v0.1
  required_result_paths:
  - answers.q1.path_change
  - answers.q2.delay_change
  - answers.q3.stage_travel
  quantity_shape:
    answers.q1.path_change: 'Quantity {value, unit}; length units m, mm, um, or nm, magnitude scored.'
    answers.q2.delay_change: 'Quantity {value, unit}; time units s, ps, or fs, magnitude scored.'
    answers.q3.stage_travel: 'Quantity {value, unit}; length units m, mm, um, or nm; nonnegative required travel.'
  permit_additional_explanation: true
gold:
  reference_model:
    equation: path change = 2*stage displacement; delay = path change/c
    valid_if: the folded geometry is double pass and propagation is in air
  numerical_checks:
  - id: n_path
    answer_path: answers.q1.path_change
    reference:
      value: 2.0
      unit: mm
    absolute_tolerance:
      value: 0.03
      unit: mm
    relative_tolerance: 0.0
    comparator: max_abs_or_relative_inclusive
    validator_id: folded_delay_path
    tolerance_rationale: Inclusive 0.03 mm accepts ordinary reporting precision around the two-pass 2.00 mm result; it is not stage calibration uncertainty.
  - id: n_delay
    answer_path: answers.q2.delay_change
    reference:
      value: 6.67
      unit: ps
    absolute_tolerance:
      value: 0.12
      unit: ps
    relative_tolerance: 0.0
    comparator: max_abs_or_relative_inclusive
    validator_id: folded_delay_time
    tolerance_rationale: Inclusive 0.12 ps accepts rounded picosecond output from a 1.00 mm stage input; it is not timing jitter.
  - id: n_travel
    answer_path: answers.q3.stage_travel
    reference:
      value: 14.99
      unit: mm
    absolute_tolerance:
      value: 0.4
      unit: mm
    relative_tolerance: 0.0
    comparator: max_abs_or_relative_inclusive
    validator_id: folded_delay_stage_for_target
    tolerance_rationale: Inclusive 0.4 mm accepts 15 mm rounded travel for the stated 100 ps target; it is not mechanical travel uncertainty.
  forbidden_claims:
  - id: f_single_pass
    predicate: stage motion changes path by only one stage displacement
scoring:
  criteria:
  - id: n_path
    weight: 0.3
    check: n_path
  - id: n_delay
    weight: 0.35
    check: n_delay
  - id: n_travel
    weight: 0.35
    check: n_travel
  hard_rule: No score cap is proposed for this draft case; retain all criterion outcomes.
  malformed_answer_rule: Missing or invalid structured paths score zero for dependent criteria; preserve
    the parse error.
  aggregation: weighted_sum_then_hard_cap
validation:
  planned_checks:
  - yaml_and_json_schema_valid
  - all_scoring_ids_resolve_and_weights_sum_to_one
  - independent_physics_review
  - positive_and_adversarial_answer_fixtures_pass
  implemented_checks:
  - independent_two_segment_path_construction
  - numerical_oracle_with_si_unit_conversion
  - positive_boundary_alternative_and_adversarial_fixtures
  independent_derivation: Translate the retroreflector by d; the forward and return segments each gain d, so optical path gains 2d. Dividing by c gives delay, and inverting for a target delay gives c times delay over two.
  adversarial_evidence: Single-pass factor-of-two, wrong dimension, malformed and absent claims, and all three tolerance boundaries are regression fixtures in benchmark/fixtures/SEED-1-5.
  evidence_files:
  - tests/test_independent_physics.py
  - tests/test_numerical_scoring.py
  notes: Challenged development case. Release requires a pinned manifest, wider challenge evidence, and CI preflight; it is not release_verified.
