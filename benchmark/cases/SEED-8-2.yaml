  license_status: CC-BY-4.0 (project benchmark content)
task:
  statement: A sample absorbs almost no light but has small spatial refractive-index variations. In free
    space, phase information must be converted into measurable intensity or the phase must be recovered
    directly.
  questions:
  - id: q1
    request: Propose at least two approaches based on different physical principles.
  - id: q2
    request: State the key reference or spatial-filtering conditions for each approach.
  - id: q3
    request: Compare their quantitative capability, stability and system complexity.
answer_contract:
  format: human_explanation_plus_json_object
  schema_id: pilot_answer_v0.1
  required_result_paths:
  - answers.q1
  - answers.q2
  - answers.q3
  permit_additional_explanation: true
gold:
  universal_constraints:
  - id: c_two_principles
    severity: hard
    predicate: At least two genuinely different phase-contrast or phase-recovery principles, such as interferometric
      imaging, phase contrast, differential interference, digital holography or phase retrieval
    evidence_path: answers.q1
  - id: c_transfer
    severity: scored
    predicate: For each approach, explain the needed reference wave, spatial filter, diversity measurement
      or other mechanism that maps phase into intensity or recovers it
    evidence_path: answers.q2
  - id: c_compare
    severity: scored
    predicate: Compare quantitative phase capability, common-mode stability, spatial resolution and system
      complexity; identify calibration or ambiguity limitations
    evidence_path: answers.q3
  accepted_solution_families:
  - id: interference
    example: Interferometric or digital-holographic phase recovery with a coherent reference.
    family_checks:
    - reference_coherence
    - phase_calibration
  - id: phase_contrast
    example: Fourier-plane phase contrast converting weak phase variations into image intensity.
    family_checks:
    - conjugate_fourier_plane
    - phase_to_intensity_transfer
  - id: differential_interference
    example: Differential interference contrast with a controlled shear and polarization states.
    family_checks:
    - shear_reference
    - directional_phase_gradient_interpretation
  - id: phase_retrieval
    example: Multi-plane intensity diversity and an inverse propagation model.
    family_checks:
    - measurement_diversity
    - ambiguity_control
  other_valid_families_policy: The listed families are examples rather than a closed whitelist. Accept
    other physically valid principles if they satisfy every public requirement.
  judge_rubrics:
  - id: draft_semantic_review
    criterion: Assess true principle diversity and tradeoffs, not named methods alone. This case remains
      development-only until reliable automated semantic scoring is demonstrated.
    judge_version: unimplemented-draft
    threshold: 0.75
    pass_examples:
    - Interferometric phase recovery and Fourier-plane phase contrast are both explained, including reference/filter
      conditions and quantitative versus stability tradeoffs.
    fail_examples:
    - Two names for the same interferometer are listed without a phase-to-intensity mechanism or comparison.
    notes: Draft only; no judge calibration or scoring implementation yet.
scoring:
  criteria:
  - id: c_two_principles
    weight: 0.35
    check: c_two_principles
  - id: c_transfer
    weight: 0.35
    check: c_transfer
  - id: c_compare
    weight: 0.3
    check: c_compare
  hard_rule: No score cap is proposed for this draft case; retain all criterion outcomes.
  malformed_answer_rule: Missing or invalid structured paths score zero for dependent criteria; preserve
    the parse error.
  aggregation: weighted_sum_then_hard_cap
validation:
  planned_checks:
  - yaml_and_json_schema_valid
  - all_scoring_ids_resolve_and_weights_sum_to_one
  - independent_physics_review
  - positive_and_adversarial_answer_fixtures_pass
  implemented_checks: []
  notes: Semantic rubric is a draft; this case is not eligible for scored release.
