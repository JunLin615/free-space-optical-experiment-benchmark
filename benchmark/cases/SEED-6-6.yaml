task:
  statement: Measure nanometre-scale axial displacement of a reflective mirror using a stable single-frequency
    laser despite air currents and mechanical vibration.
  questions:
  - id: q1
    request: Propose at least two interferometric architectures.
  - id: q2
    request: Explain how to improve immunity to environmental perturbations.
  - id: q3
    request: Give the conversion from measured fringe phase change to axial mirror displacement.
answer_contract:
  format: human_explanation_plus_json_object
  schema_id: pilot_answer_v0.1
  required_result_paths:
  - answers.q1
  - answers.q2
  - answers.q3
  method_shape:
    q1: Object giving the requested physical reasoning, design, calibration, or diagnostic evidence.
    q2: Object giving the requested physical reasoning, design, calibration, or diagnostic evidence.
    q3: Object giving the requested physical reasoning, design, calibration, or diagnostic evidence.
  permit_additional_explanation: true
gold:
  visibility: private
  universal_constraints:
  - id: c_q1
    severity: scored
    predicate: Give at least two viable layouts, such as Michelson, differential, common-path, or quasi-common-path
      interferometry, with a moving-mirror phase observable.
    evidence_path: answers.q1
  - id: c_q2
    severity: scored
    predicate: Control environmental error through shorter or shared paths, enclosure, differential referencing,
      vibration isolation, and/or phase stabilization; explain which noise each control targets.
    evidence_path: answers.q2
  - id: c_q3
    severity: scored
    predicate: For a single normal-incidence reflection and double optical pass, derive Δφ = 4πx/λ and x =
      λΔφ/(4π); use the actual projection and pass count for modified geometries.
    evidence_path: answers.q3
  accepted_solution_families:
  - id: michelson
    example: Use a Michelson moving-mirror arm with phase tracking and a stable reference arm.
  - id: differential_common_path
    example: Use a shared or differential reference that rejects common air and mechanical fluctuations.
  other_valid_families_policy: Equivalent interferometers pass if their phase-displacement conversion is derived
    from their actual pass count and incidence geometry.
  forbidden_claims:
  - id: f_1
    predicate: Use x = λΔφ/(2π) for an ordinary single reflection moving-mirror arm without accounting for
      its return path.
