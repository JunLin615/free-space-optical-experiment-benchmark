task:
  statement: A proposed design claims that placing a small pinhole at any sharp image plane implements
    standard Fourier spatial filtering.
  questions:
  - id: q1
    request: Assess the claim.
  - id: q2
    request: Where should a pinhole be placed to select spatial frequencies in the standard arrangement?
  - id: q3
    request: What does a pinhole at an image plane select, compared with one at a Fourier plane?
answer_contract:
  format: human_explanation_plus_json_object
  schema_id: pilot_answer_v0.1
  required_result_paths:
  - answers.q1
  - answers.q2
  - answers.q3
  permit_additional_explanation: true
gold:
  universal_constraints:
  - id: c_assess
    severity: scored
    predicate: Reject the claim that any sharp image plane is interchangeable with a Fourier plane for
      direct spatial-frequency selection.
    evidence_path: answers.q1
  - id: c_plane
    severity: scored
    predicate: Place the frequency-selective pinhole at a lens Fourier plane, or a plane optically conjugate
      to it, where angle or spatial frequency is mapped to position.
    evidence_path: answers.q2
  - id: c_compare
    severity: scored
    predicate: An image-plane pinhole chiefly selects a local image or object region; a Fourier-plane
      pinhole selects angular-spectrum or spatial-frequency components.
    evidence_path: answers.q3
  accepted_solution_families:
  - id: fourier_plane_filter
    example: Use a properly located focal or pupil-conjugate plane for frequency selection.
    family_checks:
    - plane_conjugacy
    - frequency_to_position_mapping
  other_valid_families_policy: Accept an equivalent Fourier-conjugate filtering layout; acknowledge secondary
    diffraction effects of an image-plane aperture without mistaking those for direct spectral selection.
