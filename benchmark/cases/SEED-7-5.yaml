  - id: c_q1
    severity: scored
    predicate: Reject full-range attenuation by rotating only the ideal half-wave plate for ideal circular
      input and a fixed linear analyzer.
    evidence_path: answers.q1
  - id: c_q2
    severity: scored
    predicate: Explain that the plate reverses circular handedness while the linear analyzer receives
      equal power in its orthogonal outputs independent of the plate orientation, apart from nonidealities.
    evidence_path: answers.q2
  - id: c_q3
    severity: scored
    predicate: Convert the circular input to a known linear state with a quarter-wave plate and then use
