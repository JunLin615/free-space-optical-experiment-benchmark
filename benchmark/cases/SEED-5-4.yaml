task:
  statement: A signal near DC is buried under 1/f noise. A mechanical chopper and lock-in amplifier are available.
  questions:
  - id: q1
    request: Explain the complete modulation and synchronous-detection logic.
  - id: q2
    request: Give at least four distinct constraints on the chopper-frequency choice.
  - id: q3
    request: Explain why the highest available chopping frequency is not automatically best.
answer_contract:
  format: human_explanation_plus_json_object
  schema_id: pilot_answer_v0.1
  required_result_paths:
  - answers.q1
  - answers.q2
  - answers.q3
  method_shape:
    q1: Object giving the requested physical reasoning, design, or diagnostic evidence.
    q2: Object giving the requested physical reasoning, design, or diagnostic evidence.
    q3: Object giving the requested physical reasoning, design, or diagnostic evidence.
  permit_additional_explanation: true
gold:
  visibility: private
  universal_constraints:
  - id: c_q1
    severity: scored
    predicate: Modulate the signal at a known frequency and recover its in-phase and quadrature or amplitude
      response using a phase-referenced narrow detection bandwidth.
    evidence_path: answers.q1
  - id: c_q2
    severity: scored
    predicate: Name at least four physically distinct frequency constraints from mains harmonics, mechanical
      resonances or chopper stability, detector and sample response, blade and spot geometry, and acquisition
      bandwidth.
    evidence_path: answers.q2
  - id: c_q3
    severity: scored
    predicate: Explain that excessive frequency can reduce modulation contrast or sample and detector response
      and introduce phase or timing errors.
    evidence_path: answers.q3
  accepted_solution_families:
  - id: mechanical_chop
    example: Chop the excitation and demodulate the signal against the chopper reference.
  - id: modulated_probe
    example: Chop the relevant probe path and demodulate its sample-dependent response when that path carries
      the desired signal.
  other_valid_families_policy: Equivalent modulation locations are acceptable if the target response, reference
    phase, and possible modulated backgrounds are correctly traced.
  forbidden_claims:
  - id: f_1
    predicate: Any arbitrarily high modulation frequency improves signal-to-noise regardless of detector or
      sample bandwidth.
