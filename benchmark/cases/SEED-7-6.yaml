task:
  statement: The input is completely unpolarized light. The goal is one pure linear-polarization output
    in the same spatial mode and direction, with no active gain and no loss of optical power.
  questions:
  - id: q1
    request: Decide whether ordinary passive polarization optics can meet all conditions.
  - id: q2
    request: Explain the physical constraint.
  - id: q3
    request: Give a standard method if optical loss is allowed.
answer_contract:
  format: human_explanation_plus_json_object
  schema_id: pilot_answer_v0.1
  required_result_paths:
  - answers.q1
  - answers.q2
  - answers.q3
  permit_additional_explanation: true
gold:
  universal_constraints:
  - id: c_q1
    severity: scored
    predicate: State that passive linear polarization optics cannot simultaneously purify a fully unpolarized
      input, keep the same single output mode and direction, and retain all power.
    evidence_path: answers.q1
  - id: c_q2
    severity: scored
    predicate: Explain that incoherent orthogonal polarization components cannot both be compressed into
      one pure state in one mode by a lossless passive transformation; rejected energy or information
      must leave through another mode or channel.
    evidence_path: answers.q2
  - id: c_q3
    severity: scored
    predicate: Use a linear polarizer or select one output of a polarizing beam splitter, acknowledging
      discarded power rather than claiming lossless purification.
    evidence_path: answers.q3
  other_valid_families_policy: Listed examples are illustrative, not a closed whitelist; accept physically
