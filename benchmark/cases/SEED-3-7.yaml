schema_version: 0.1.0
case_id: SEED-3-7
legacy_id: '3.7'
case_revision: 0.1.0
benchmark_release: null
validation_status: specified
split: public_dev
title: Diffraction-limited lateral resolution
language: en
taxonomy:
  optical_domain: fourier_optics
  task_types:
  - quantitative_inference
  - conceptual_reasoning
  difficulty_hypothesis: advanced
  modality: text
provenance:
  origin: user_supplied_chinese_html_seed
  source_hash: 077DB14D2A5C67A3123C82AF1D571F8FFA73D3C79501C7C9D8C99E021C2318A8
  seed_relationship: Translation of case 3.7 in the original 64-case HTML seed.
  created_utc: '2026-09-28'
  source_references: []
  derivation: English translation of the original seed prompt and tasks. The Rayleigh criterion is named
    explicitly because other resolution conventions give different coefficients. The ideal scalar estimate
    is 0.671 micrometers.
  license_status: CC-BY-4.0 (project benchmark content)
task:
  statement: A microscope objective images at wavelength 550 nm with numerical aperture 0.50. Neglect
    aberrations and use the Rayleigh lateral-resolution estimate.
  questions:
  - id: q1
    request: Estimate the lateral diffraction-limited separation in micrometers.
  - id: q2
    request: Is the scale closer to 0.1, 1 or 10 micrometers?
  - id: q3
    request: What is the typical effect of increasing numerical aperture on depth of focus?
  givens:
  - symbol: wavelength
    value: 550
    unit: nm
  - symbol: numerical_aperture
    value: 0.5
    unit: '1'
answer_contract:
  format: human_explanation_plus_json_object
  schema_id: pilot_answer_v0.1
  required_result_paths:
  - answers.q1.resolution_um
  - answers.q2
  - answers.q3
  permit_additional_explanation: true
gold:
  reference_model:
    equation: delta = 0.61 lambda / NA
    valid_if: Rayleigh criterion, approximately diffraction-limited imaging, fixed wavelength and medium.
  numerical_checks:
  - id: n_rayleigh
    answer_path: answers.q1.resolution_um
    reference:
      value: 0.671
      unit: um
    absolute_tolerance:
      value: 0.03
      unit: um
    relative_tolerance: 0
    comparator: max_abs_or_relative_inclusive
    formula: 0.61 * 0.550 um / 0.50
  universal_constraints:
  - id: c_scale
    severity: scored
    predicate: The 0.67 micrometer estimate is closest to 1 micrometer among the offered choices.
    evidence_path: answers.q2
  - id: c_depth
    severity: scored
    predicate: At fixed wavelength and imaging conditions, larger numerical aperture generally narrows
      depth of focus and increases focus sensitivity.
    evidence_path: answers.q3
  accepted_solution_families:
  - id: rayleigh
    example: Use delta approximately 0.61 wavelength divided by numerical aperture.
    family_checks:
    - consistent_units
    - rayleigh_factor
  other_valid_families_policy: Accept the stated Rayleigh convention and numerically equivalent unit conversions;
    a different well-defined diffraction criterion needs its own justified scale, not an arbitrary value.
scoring:
  criteria:
  - id: n_rayleigh
    weight: 0.5
    check: n_rayleigh
  - id: c_scale
    weight: 0.2
    check: c_scale
  - id: c_depth
    weight: 0.3
    check: c_depth
  hard_rule: No score cap is proposed for this draft case; retain all criterion outcomes.
  malformed_answer_rule: Missing or invalid structured paths score zero for dependent criteria; preserve
    the parse error.
  aggregation: weighted_sum_then_hard_cap
validation:
  planned_checks:
  - yaml_and_json_schema_valid
  - all_scoring_ids_resolve_and_weights_sum_to_one
  - independent_physics_review
  - positive_and_adversarial_answer_fixtures_pass
  implemented_checks: []
  notes: Draft oracle only; automated positive, alternative-valid, boundary and adversarial evidence is
    required before status promotion.
