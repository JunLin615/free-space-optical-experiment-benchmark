task:
  statement: A solid sample requires spatially localized Raman spectroscopy with axial sectioning.
  questions:
  - id: q1
    request: Lay out the essential optical chain from laser to sample and then to spectrometer.
  - id: q2
    request: Distinguish the functions of Rayleigh-rejection optics and the confocal pinhole.
  - id: q3
    request: Explain the main cost of making the pinhole too small.
answer_contract:
  format: human_explanation_plus_json_object
  schema_id: pilot_answer_v0.1
  required_result_paths:
  - answers.q1
  - answers.q2
  - answers.q3
  method_shape:
    q1: Object giving the requested physical reasoning, design, or diagnostic evidence.
    q2: Object giving the requested physical reasoning, design, or diagnostic evidence.
    q3: Object giving the requested physical reasoning, design, or diagnostic evidence.
  permit_additional_explanation: true
gold:
  visibility: private
  universal_constraints:
  - id: c_q1
    severity: scored
    predicate: Specify laser conditioning and coupling, focused excitation at the sample, collected Raman light,
      pre-spectrometer Rayleigh rejection, a conjugate confocal aperture, and spectrometer detection.
    evidence_path: answers.q1
  - id: c_q2
    severity: scored
    predicate: Assign spectral suppression of elastic excitation light to the rejection optics and spatial
      rejection of out-of-focus light to the pinhole.
    evidence_path: answers.q2
  - id: c_q3
    severity: scored
    predicate: Explain loss of Raman throughput and increased alignment or aberration sensitivity with an excessively
      small pinhole.
    evidence_path: answers.q3
  accepted_solution_families:
  - id: epi_collection
    example: Use a microscope objective for both excitation and collection with dichroic separation.
  - id: separate_collection
    example: Use separate excitation and collection objectives with an imaged sample volume and conjugate pinhole.
  other_valid_families_policy: Either collection topology is acceptable if the pinhole images the desired sample
    volume and strong Rayleigh light is suppressed before it consumes spectrometer dynamic range.
  forbidden_claims:
  - id: f_1
    predicate: A pinhole alone spectrally removes Rayleigh light.
