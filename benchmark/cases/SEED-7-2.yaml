language: en
taxonomy:
  optical_domain: beam_diagnostics
  task_types:
  - diagnosis
  difficulty_hypothesis: intermediate
  modality: text
provenance:
  origin: user_supplied_chinese_html_seed
  source_hash: 077DB14D2A5C67A3123C82AF1D571F8FFA73D3C79501C7C9D8C99E021C2318A8
  seed_relationship: Translation of case 7.2 in the original 64-case HTML seed.
