schema_version: 0.1.0
case_id: SEED-1-7
legacy_id: '1.7'
case_revision: 0.2.1
benchmark_release: 0.1.0-rc1
validation_status: release_verified
split: public_eval
title: Half-wave plate and linear polarization
language: en
taxonomy:
  optical_domain: polarization
  task_types:
  - quantitative_inference
  - conceptual_reasoning
  difficulty_hypothesis: introductory
  modality: text
provenance:
  origin: user_supplied_chinese_html_seed
  source_hash: 077DB14D2A5C67A3123C82AF1D571F8FFA73D3C79501C7C9D8C99E021C2318A8
  seed_relationship: Translation of case 1.7 in the original 64-case HTML seed.
  created_utc: '2026-09-28'
  source_references: []
  derivation: English translation of the original seed prompt and tasks. Because the seed omits a signed
    viewing convention, the requested rotation values are magnitudes. Revision 0.2.0 specifies a typed
    yes-or-no claim for q3 without requiring the unasked handedness detail.
    Revision 0.2.1 pins the qualified typed-answer oracle and challenge evidence for 0.1.0-rc1.
  license_status: CC-BY-4.0 (project benchmark content)
task:
  statement: Linearly polarized light passes through an ideal half-wave plate. The incident polarization
    axis makes an angle of 17° with the plate's fast axis.
  questions:
  - id: q1
    request: By what magnitude does the output linear-polarization direction rotate relative to the input?
  - id: q2
    request: If the half-wave plate itself is rotated a further 5°, by what magnitude does the output
      direction change?
  - id: q3
    request: State whether the same linear-polarization rule can be applied directly to circularly polarized
      input.
  givens:
  - value: 17
    unit: deg
    symbol: input_to_fast_axis_angle
  - value: 5
    unit: deg
    symbol: plate_rotation
answer_contract:
  format: human_explanation_plus_json_object
  schema_id: pilot_answer_v0.1
  required_result_paths:
  - answers.q1.rotation_magnitude
  - answers.q2.output_change_magnitude
  - answers.q3.linear_rotation_rule_applies
  quantity_shape:
    answers.q1.rotation_magnitude: Quantity {value, unit}; angle units deg or rad.
    answers.q2.output_change_magnitude: Quantity {value, unit}; angle units deg or rad.
  method_shape:
    q3: 'Object with linear_rotation_rule_applies: false. Optional explanation may note that ideal circular input remains circular with reversed handedness.'
  permit_additional_explanation: true
gold:
  reference_model:
    equation: output linear-polarization axis is the reflection of the input axis about the wave-plate
      fast axis
    valid_if: ideal half-wave retardance and linear input
  numerical_checks:
  - id: n_rotation
    answer_path: answers.q1.rotation_magnitude
    reference:
      value: 34
      unit: deg
    absolute_tolerance:
      value: 0.5
      unit: deg
    relative_tolerance: 0.0
    comparator: max_abs_or_relative_inclusive
    validator_id: half_wave_relative_rotation_magnitude
  - id: n_plate_effect
    answer_path: answers.q2.output_change_magnitude
    reference:
      value: 10
      unit: deg
    absolute_tolerance:
      value: 0.5
      unit: deg
    relative_tolerance: 0.0
    comparator: max_abs_or_relative_inclusive
    validator_id: half_wave_plate_rotation_effect
  universal_constraints:
  - id: c_circular
    severity: scored
    predicate: The linear-axis rotation rule cannot be applied directly to circular input. An ideal half-wave
      plate instead reverses circular handedness; that additional explanation is not required by q3.
    evidence_path: answers.q3.linear_rotation_rule_applies
  forbidden_claims:
  - id: f_circular_linear
    predicate: two-angle linear-rotation rule applies directly to circular input
scoring:
  criteria:
  - id: n_rotation
    weight: 0.35
    check: n_rotation
  - id: n_plate_effect
    weight: 0.35
    check: n_plate_effect
  - id: c_circular
    weight: 0.3
    check: c_circular
  hard_rule: No score cap is proposed for this draft case; retain all criterion outcomes.
  malformed_answer_rule: Missing or invalid structured paths score zero for dependent criteria; preserve
    the parse error.
  aggregation: weighted_sum_then_hard_cap
validation:
  planned_checks:
  - yaml_and_json_schema_valid
  - all_scoring_ids_resolve_and_weights_sum_to_one
  - independent_physics_review
  - positive_and_adversarial_answer_fixtures_pass
  implemented_checks:
  - independent_jones_matrix_crosscheck
  - unit_aware_numerical_oracle
  - typed_circular_input_oracle
  - positive_boundary_alternative_and_adversarial_fixtures
  notes: Release-verified typed-answer scorer for 0.1.0-rc1. Independent executable physics checks,
    alternative-valid and boundary fixtures, and distinct negative and adversarial failure families
    pass the automated gate. Optional prose is outside the scored contract.

  independent_derivation: Reflection of a linear Jones vector about the half-wave plate axis gives an
    output axis displaced by twice the input-to-axis separation; turning the plate by an additional angle
    turns that output axis by twice the plate angle. Jones circular eigenstates reverse handedness.
  adversarial_evidence: Quadruplicated wave-plate rotation and a polished claim that the circular input follows the linear-axis rule are rejected by independent regression fixtures.
  evidence_files:
  - tests/test_deterministic_qualification.py
  positive_fixtures:
  - benchmark/fixtures/SEED-1-7/positive_reference.json
  - benchmark/fixtures/SEED-1-7/alternative_valid_radians.json
  negative_fixtures:
  - benchmark/fixtures/SEED-1-7/negative_single_angle.json
  - benchmark/fixtures/SEED-1-7/adversarial_circular_linear_rule.json
