task:
  statement: Measure a sample's weak response after ultrafast excitation with subpicosecond time resolution
    in the presence of a strong scattering background.
  questions:
  - id: q1
    request: Design pump and probe paths.
  - id: q2
    request: Explain the combined time-resolution limits.
  - id: q3
    request: Suppress scattered background without deleting the signal.
  - id: q4
    request: Demonstrate that the observed response is pump induced.
answer_contract:
  format: human_explanation_plus_json_object
  schema_id: pilot_answer_v0.1
  required_result_paths:
  - answers.q1
  - answers.q2
  - answers.q3
  - answers.q4
  permit_additional_explanation: true
gold:
  universal_constraints:
  - id: c_q1
    severity: scored
    predicate: Include pump/probe generation, delay, spatial and temporal overlap, pump-state control,
      and selective detection.
    evidence_path: answers.q1
  - id: c_q2
    severity: scored
    predicate: Account for pulse widths or cross-correlation, dispersion, crossing-angle or interaction
      geometry, timing jitter, and detector strategy rather than attributing resolution to stage step
      alone.
    evidence_path: answers.q2
  - id: c_q3
    severity: scored
    predicate: Use a defensible combination of spatial, spectral, polarization, modulation, differential,
      or phase-sensitive rejection with a signal-retention check.
    evidence_path: answers.q3
  - id: c_q4
    severity: scored
    predicate: Use pump-on/off controls, negative-delay baseline, power dependence, timing confirmation,
      or another discriminating consistency test with background subtraction.
    evidence_path: answers.q4
  other_valid_families_policy: Listed examples are illustrative, not a closed whitelist; accept physically
    equivalent approaches satisfying the stated observable and constraints.
  accepted_solution_families:
  - id: transient_transmission
    example: Modulated pump and delayed probe measure differential transmission with reference normalization.
  - id: nonlinear_cross_correlation
    example: A nonlinear gating or correlation observable selects pump-induced response in time.
  - id: heterodyne_probe
    example: A reference field enables coherent detection of a weak pump-induced change.
