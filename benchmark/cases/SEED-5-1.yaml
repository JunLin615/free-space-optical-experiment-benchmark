  derivation: The seed suggests near-90-degree collection; the translation permits other off-axis geometries
    that meet the same physical purpose.
  license_status: CC-BY-4.0 (project benchmark content)
task:
  statement: Monochromatic light excites a transparent sample. The fluorescence to be measured is much weaker
    than the excitation light.
  questions:
  - id: q1
    request: Design the basic geometry of excitation and collection directions.
  - id: q2
    request: Explain why collection near 90 degrees to the excitation direction is common.
  - id: q3
    request: Identify at least two distinct backgrounds that still require additional suppression.
answer_contract:
  format: human_explanation_plus_json_object
  schema_id: pilot_answer_v0.1
  required_result_paths:
  - answers.q1
  - answers.q2
  - answers.q3
  method_shape:
    q1: Object with excitation_path, collection_direction, direct_beam_handling.
    q2: Object with direct_transmission_rejection and residual_scatter explanation.
    q3: 'Object with backgrounds: array of at least two distinct mechanisms and optional suppression methods.'
  permit_additional_explanation: true
gold:
  visibility: private
  universal_constraints:
  - id: c_q1
    severity: scored
    predicate: Place the direct excitation beam on a defined through path and collect fluorescence from a transverse
      direction without routing transmitted excitation into the detector.
    evidence_path: answers.q1
  - id: c_q2
    severity: scored
    predicate: Explain that transverse collection reduces direct transmitted-excitation leakage but does not
      by itself remove scattered excitation.
    evidence_path: answers.q2
  - id: c_q3
    severity: scored
    predicate: Identify at least two distinct residual mechanisms, such as sample or cell scattering, stray
      or ambient light, and finite filter rejection.
    evidence_path: answers.q3
  accepted_solution_families:
  - id: transverse_collection
    example: A side-view collection lens near 90 degrees, with baffling and spectral filtering.
  - id: oblique_collection
    example: An oblique collection angle that avoids the direct excitation beam, with equivalent rejection
      and collection-solid-angle evidence.
  other_valid_families_policy: Other off-axis geometries are valid if they keep the direct beam out of the
    detector and justify the chosen background controls.
  forbidden_claims:
  - id: f_1
    predicate: A 90-degree view alone removes all scattered excitation or makes spectral filtering unnecessary.
scoring:
  criteria:
  - id: c_q1
    weight: 0.33333333
    check: c_q1
    question_id: q1
  - id: c_q2
    weight: 0.33333333
    check: c_q2
