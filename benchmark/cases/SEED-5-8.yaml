  license_status: CC-BY-4.0 (project benchmark content)
task:
  statement: A desired emission line lies near 650.0 nm on a broadband continuum, while scattered 532 nm excitation
    is very strong. Free-space optical filters and a spectrometer are available.
  questions:
  - id: q1
    request: Propose at least three stages of background suppression between sample and detector.
  - id: q2
    request: Explain why relying only on the spectrometer is usually suboptimal.
  - id: q3
    request: Explain the risk of an excessively narrow optical passband.
  givens:
  - value: 650.0
    unit: nm
    symbol: target_line
  - value: 532.0
    unit: nm
    symbol: excitation_wavelength
answer_contract:
  format: human_explanation_plus_json_object
  schema_id: pilot_answer_v0.1
  required_result_paths:
  - answers.q1
  - answers.q2
  - answers.q3
  method_shape:
    q1: 'Object with ordered_stages: array of at least three optical or spectral suppression stages and target
      throughput.'
    q2: Object with spectrometer_only_failure mechanisms.
    q3: Object with passband_risks and verification.
  permit_additional_explanation: true
gold:
  visibility: private
  universal_constraints:
  - id: c_q1
    severity: scored
    predicate: Combine direct-beam geometry or baffling, excitation-rejection prefiltering, and final spectrometer
      dispersion while preserving the 650.0 nm signal.
    evidence_path: answers.q1
  - id: c_q2
    severity: scored
    predicate: Explain that high pre-spectrometer background can create internal stray light, consume dynamic
      range, or saturate the detector.
    evidence_path: answers.q2
  - id: c_q3
    severity: scored
    predicate: Account for filter angle, temperature, finite line width or drift, and alignment tolerances
      that can attenuate the target line.
    evidence_path: answers.q3
  accepted_solution_families:
  - id: long_pass_then_spectrometer
    example: Reject 532 nm using a suitable long-pass or notch stage, then resolve the 650 nm line spectrally.
  - id: band_pass_then_spectrometer
    example: Use a passband around 650 nm ahead of the spectrometer after geometric suppression, with measured
      transmission and drift margin.
  other_valid_families_policy: Other filter orders or wavelength-selective optics are valid if measured excitation
    extinction and target throughput satisfy the required dynamic range.
  forbidden_claims:
  - id: f_1
    predicate: A spectrometer alone is guaranteed to tolerate arbitrarily strong excitation scatter.
scoring:
