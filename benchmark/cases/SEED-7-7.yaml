gold:
  universal_constraints:
  - id: c_q1
    severity: scored
    predicate: Give at least eight distinct plausible mechanisms rather than synonyms. Spatial, temporal,
      sample-response, optical-power, detector, modulation/reference, spectral-filter, dispersion, and
      acquisition problems are examples; an answer need not include every named category.
    evidence_path: answers.q1
  - id: c_q2
    severity: scored
    predicate: Check beam delivery, detector linearity and references, then overlap in the interaction
      volume and signal extraction, before changing sample assumptions or interpreting absent dynamics.
    evidence_path: answers.q2
  - id: c_q3
    severity: scored
    predicate: Use an independent cross-correlation, sum-frequency, two-photon, or equivalent nonlinear
      timing signal, and compare its time-zero location with the actual mechanical scan range.
    evidence_path: answers.q3
