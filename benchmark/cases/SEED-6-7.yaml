  license_status: CC-BY-4.0 (project benchmark content)
task:
  statement: A visible continuous-wave beam contains obvious speckle and high-spatial-frequency wavefront artifacts
    before a high-contrast interferometer.
  questions:
  - id: q1
    request: Design a conditioning chain from source to interferometer entrance.
  - id: q2
    request: Explain the reason for the order of the modules.
  - id: q3
    request: Give at least three measurable output acceptance criteria.
answer_contract:
  format: human_explanation_plus_json_object
  schema_id: pilot_answer_v0.1
  required_result_paths:
  - answers.q1
  - answers.q2
  - answers.q3
  method_shape:
    q1: Object giving the requested physical reasoning, design, calibration, or diagnostic evidence.
    q2: Object giving the requested physical reasoning, design, calibration, or diagnostic evidence.
    q3: Object giving the requested physical reasoning, design, calibration, or diagnostic evidence.
  permit_additional_explanation: true
gold:
  visibility: private
  universal_constraints:
  - id: c_q1
    severity: scored
    predicate: Include pointing and power or polarization control, spatial-mode cleaning, re-collimation and
      beam-size matching, and a stable entrance-axis reference.
    evidence_path: answers.q1
  - id: c_q2
    severity: scored
    predicate: Justify the order so filtering occurs with suitable power and focus, output is re-collimated
      and matched, and downstream controls do not reintroduce mode defects.
    evidence_path: answers.q2
  - id: c_q3
    severity: scored
    predicate: State at least three measurable criteria among beam diameter, divergence, near/far-field profile
      or M², pointing stability, polarization, and interference visibility, with a measurement method or limit
      for each.
    evidence_path: answers.q3
  accepted_solution_families:
  - id: pinhole_filter
    example: Focus through a protected free-space pinhole and re-collimate the selected mode.
  - id: mode_cleaner_cavity
    example: Use a mode-cleaner cavity and mode-match its output to the interferometer.
  other_valid_families_policy: Other spatial-mode cleaning methods pass if they suppress high-spatial-frequency
    artifacts without unacceptable power or pointing instability and provide measured acceptance evidence.
  forbidden_claims:
  - id: f_1
    predicate: A pinhole at an arbitrary plane cleans wavefront artifacts without correct focusing or output
      re-collimation.
scoring:
  criteria:
  - id: c_q1
    weight: 0.33333333
    check: c_q1
