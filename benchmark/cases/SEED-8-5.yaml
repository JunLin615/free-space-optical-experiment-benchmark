  license_status: CC-BY-4.0 (project benchmark content)
task:
  statement: A mechanically imperfect laboratory needs to measure a small phase change. Use a common-path
    or nearly common-path optical architecture where possible to reduce environmental sensitivity.
  questions:
  - id: q1
    request: Propose a common-path or nearly common-path interferometer.
  - id: q2
    request: Explain how signal and reference channels are distinguishable.
  - id: q3
    request: Distinguish disturbances that cancel from those that remain.
  - id: q4
    request: Give a phase-response calibration.
answer_contract:
  format: human_explanation_plus_json_object
  schema_id: pilot_answer_v0.1
  required_result_paths:
  - answers.q1
  - answers.q2
  - answers.q3
  - answers.q4
  permit_additional_explanation: true
gold:
  universal_constraints:
  - id: c_q1
    severity: scored
    predicate: Describe a physically workable polarization-, spatial-shear-, Sagnac-, or other shared-path
      architecture with a detectable interference observable.
    evidence_path: answers.q1
  - id: c_q2
    severity: scored
    predicate: Identify the channel label or degree of freedom that lets two largely shared fields acquire
      and reveal a differential sample phase.
    evidence_path: answers.q2
  - id: c_q3
    severity: scored
    predicate: Separate reciprocal common-mode drift from local, differential, nonreciprocal, or polarization-dependent
      phase and amplitude errors.
    evidence_path: answers.q3
  - id: c_q4
    severity: scored
    predicate: Use a known phase, displacement, electro-optic, or piezoelectric perturbation and a response
      curve or equivalent independent calibration.
    evidence_path: answers.q4
  other_valid_families_policy: Listed examples are illustrative, not a closed whitelist; accept physically
    equivalent approaches satisfying the stated observable and constraints.
  accepted_solution_families:
  - id: polarization_common_path
    example: Orthogonal polarization channels share most optics and are recombined with calibrated differential
      phase.
  - id: shearing_interferometry
    example: Nearby spatial channels share a path while sampling distinguishable sample regions.
  - id: sagnac
    example: Counterpropagating channels share an interferometer loop but retain specified differential
      sensitivity.
