case_revision: 0.1.0
benchmark_release: null
validation_status: specified
split: public_dev
title: Expanding and spatially filtering high-peak-power pulses
language: en
taxonomy:
  optical_domain: ultrafast_optics
  task_types: [experimental_design, error_analysis]
  difficulty_hypothesis: advanced
  modality: text
provenance:
  origin: user_supplied_chinese_html_seed
  source_hash: 077DB14D2A5C67A3123C82AF1D571F8FFA73D3C79501C7C9D8C99E021C2318A8
  seed_relationship: Translation of case 2.3 in the original 64-case HTML seed.
  created_utc: '2026-09-28'
  source_references: []
  derivation: >-
    Translates the seed's expansion and filtering task. A 1 mJ/100 fs pulse
    implies order-10 GW nominal peak power before temporal-shape factors, but
    no incident diameter, lens properties, or damage thresholds are supplied;
    the answer must identify measurements and checks rather than assert safety.
  license_status: CC-BY-4.0 (project benchmark content)
task:
  statement: >-
    An 800 nm, 100 fs, 1 mJ pulsed laser must be expanded by approximately
    fourfold. High-spatial-frequency beam artifacts should also be reduced.
    The input beam diameter, pulse shape, optic ratings, and environment have
    not yet been specified.
  questions:
  - id: q1
    request: Propose a feasible expansion and beam-cleaning architecture, identifying conditions under which it can be used.
  - id: q2
    request: Identify the principal damage or breakdown locations and the physical reason for the risk.
  - id: q3
    request: If a pinhole filter is selected, name the design quantities and checks needed before it can be considered safe and useful.
  givens:
  - {symbol: wavelength, value: 800, unit: nm}
  - {symbol: pulse_duration, value: 100, unit: fs}
  - {symbol: pulse_energy, value: 1, unit: mJ}
  - {symbol: expansion_factor, value: 4, unit: '1'}
answer_contract:
  format: human_explanation_plus_json_object
  schema_id: pilot_answer_v0.1
  required_result_paths: [answers.q1, answers.q2, answers.q3]
  permit_additional_explanation: true
gold:
  universal_constraints:
  - id: c_architecture
    severity: scored
    predicate: >-
      Describe a roughly fourfold expander and a plausible way to reject
      high-spatial-frequency content, with its operating assumptions and
      measured beam-quality acceptance check.
    evidence_path: answers.q1
  - id: c_risk
    severity: scored
    predicate: >-
      The concentrated internal-focus intensity can cause air ionization,
      pinhole damage, or optic/coating damage; nonlinear phase and dispersion
      may also compromise the pulse.
    evidence_path: answers.q2
  - id: c_filter_design
    severity: scored
    predicate: >-
      Determine beam diameter, focal lengths, focal spot and fluence/intensity,
      pinhole size and material, component damage thresholds, alignment tolerance,
      environment, nonlinear effects, and pulse dispersion before using a pinhole.
    evidence_path: answers.q3
  accepted_solution_families:
  - id: qualified_keplerian_filter
    example: An evacuated or otherwise validated real-focus telescope with a suitably sized pinhole, qualified fluence, and measured throughput and profile.
  - id: nonfocusing_expansion_plus_cleaning
    example: A Galilean expansion stage combined with a separately justified lower-risk wavefront or source-mode cleanup method.
  other_valid_families_policy: Accept alternative physically justified architectures when they address the stated spatial artifacts, fourfold expansion, and actual peak-power limits.
  forbidden_claims:
  - id: f_unqualified_filter
    predicate: Any fourfold Keplerian telescope with an arbitrary pinhole is safe at the supplied pulse energy without beam-size or damage analysis.
  known_failure_modes:
  - A larger output beam alone need not remove high-spatial-frequency artifacts.
  - A pinhole near a real focus may itself be damaged and may introduce nonlinear or dispersive effects.
scoring:
  criteria:
  - {id: c_architecture, weight: 0.35, check: c_architecture, question_id: q1}
  - {id: c_risk, weight: 0.3, check: c_risk, question_id: q2}
  - {id: c_filter_design, weight: 0.35, check: c_filter_design, question_id: q3}
  hard_rule: No score cap is proposed for this draft case; retain all criterion outcomes.
  malformed_answer_rule: Missing or invalid structured paths score zero for dependent criteria; preserve the parse error.
  aggregation: weighted_sum_then_hard_cap
validation:
  planned_checks: [yaml_and_json_schema_valid, all_scoring_ids_resolve_and_weights_sum_to_one, independent_physics_review, positive_and_adversarial_answer_fixtures_pass, calibrated_semantic_judge]
  implemented_checks: []
  notes: Damage analysis is conditional on missing hardware and beam parameters; no safety certification is implied.
