  license_status: CC-BY-4.0 (project benchmark content)
task:
  statement: >-
    A linearly polarized continuous-wave laser needs a wide continuously adjustable
    transmitted power range. The useful output direction should remain essentially
    fixed, and an absorbing element should not carry the main attenuation load.
  questions:
  - id: q1
    request: Give a standard free-space optical arrangement.
  - id: q2
    request: Explain how the chosen control changes the power delivered to the useful output.
  - id: q3
    request: State how the unused output should be handled.
answer_contract:
  format: human_explanation_plus_json_object
  schema_id: pilot_answer_v0.1
  required_result_paths: [answers.q1, answers.q2, answers.q3]
  permit_additional_explanation: true
gold:
  universal_constraints:
  - id: c_architecture
    severity: scored
    predicate: Use a rotatable half-wave plate followed by a fixed polarizing beam splitter, or an equivalent nonabsorbing variable polarization splitter.
    evidence_path: answers.q1
  - id: c_partition
    severity: scored
    predicate: Rotating input linear polarization relative to the splitter axes continuously redistributes power between the fixed output ports.
    evidence_path: answers.q2
  - id: c_dump
    severity: scored
    predicate: Terminate the unused port in a properly rated beam dump with suitable thermal management and safe beam containment.
    evidence_path: answers.q3
  accepted_solution_families:
  - id: hwp_pbs
    example: Rotate a half-wave plate before a fixed polarizing beam splitter and use one fixed port as the output.
  - id: equivalent_polarization_splitter
    example: Use another adjustable retardance or polarization-control assembly feeding a fixed polarization separator, with a rated dump on the rejected port.
  other_valid_families_policy: Accept physically equivalent free-space designs that vary power continuously, keep the useful beam direction fixed, and dispose of rejected power safely.
  known_failure_modes:
  - Real extinction, wave-plate wavelength rating, and power handling limit the achievable range.
  - This arrangement assumes a known linearly polarized input; circular or unpolarized input requires separate treatment.
scoring:
  criteria:
  - {id: c_architecture, weight: 0.35, check: c_architecture, question_id: q1}
  - {id: c_partition, weight: 0.35, check: c_partition, question_id: q2}
  - {id: c_dump, weight: 0.3, check: c_dump, question_id: q3}
  hard_rule: No score cap is proposed for this draft case; retain all criterion outcomes.
  malformed_answer_rule: Missing or invalid structured paths score zero for dependent criteria; preserve the parse error.
  aggregation: weighted_sum_then_hard_cap
validation:
  planned_checks: [yaml_and_json_schema_valid, all_scoring_ids_resolve_and_weights_sum_to_one, independent_physics_review, positive_and_adversarial_answer_fixtures_pass, calibrated_semantic_judge]
