task:
  statement: An intensity pattern in one plane must be relayed without magnification to another, distant
    plane, with room between them for a stop.
  questions:
  - id: q1
    request: Give the basic layout of a two-lens relay.
  - id: q2
    request: Identify the plane suitable for a spatial-frequency stop.
  - id: q3
    request: Explain how that intermediate plane differs from an ordinary image plane.
  allowed_resources: Any scientific or optical tool; no product-specific implementation is required.
answer_contract:
  format: human_explanation_plus_json_object
  schema_id: pilot_answer_v0.1
  required_result_paths:
  - answers.q1
  - answers.q2
  - answers.q3
  permit_additional_explanation: true
gold:
  universal_constraints:
  - id: c_4f
    severity: hard
    predicate: 'Equal-focal-length 4f relay: object at first front focal plane, lenses separated by 2f,
      final image at second rear focal plane'
    evidence_path: answers.q1
  - id: c_fourier
    severity: scored
    predicate: Shared focal plane between the lenses is the Fourier plane and suitable for a spatial-frequency
      stop
    evidence_path: answers.q2
  - id: c_not_image
    severity: scored
    predicate: Intermediate plane represents spatial-frequency content rather than direct geometric image
    evidence_path: answers.q3
  accepted_solution_families:
  - id: equal_lens_4f
    example: Two equal positive focal lengths in a unity-magnification 4f relay.
    family_checks:
    - correct_conjugate_placement
    - accessible_shared_focal_plane
  other_valid_families_policy: Accept an optically equivalent unity-magnification two-lens relay if it
    identifies a true Fourier plane and satisfies the task.
