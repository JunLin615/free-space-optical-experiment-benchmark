  license_status: CC-BY-4.0 (project benchmark content)
task:
  statement: In a Raman spectrometer, the detector repeatedly reaches full scale while the desired weak Raman
    peak cannot be distinguished.
  questions:
  - id: q1
    request: Assess whether increasing laser power is a sensible first action.
  - id: q2
    request: Give at least four distinct higher-priority checks or corrections.
  - id: q3
    request: Explain why dynamic range is a system-level issue.
answer_contract:
  format: human_explanation_plus_json_object
  schema_id: pilot_answer_v0.1
  required_result_paths:
  - answers.q1
  - answers.q2
  - answers.q3
  method_shape:
    q1: 'Object with first_action_appropriate: boolean and physical reason.'
    q2: 'Object with prioritized_checks: array of at least four distinct checks and predicted findings.'
    q3: Object with optical_background, detector_range, and measurable_consequence.
  permit_additional_explanation: true
gold:
  visibility: private
  universal_constraints:
  - id: c_q1
    severity: scored
    predicate: Reject raising excitation power as the first remedy while the detector is saturated; note possible
      additional sample or optic damage.
    evidence_path: answers.q1
  - id: c_q2
    severity: scored
    predicate: Prioritize at least four distinct checks spanning optical leakage or Rayleigh rejection, filters,
      spectrometer stray light or slit, detector gain or integration time, sample background, and path leaks.
    evidence_path: answers.q2
  - id: c_q3
    severity: scored
    predicate: Explain that strong background consumes the finite optical and electronic measurement range
      before weak Raman light can be quantified.
    evidence_path: answers.q3
  accepted_solution_families:
  - id: optical_pre_rejection
    example: Find and reject elastic scatter or stray light before it reaches the spectrometer and detector.
  - id: readout_reset
    example: Reduce gain or integration time to restore linearity, then address the remaining optical background
      and test Raman sensitivity.
  other_valid_families_policy: Any diagnostic sequence is valid if it first establishes a linear unsaturated
    measurement and discriminates optical from detector causes.
  forbidden_claims:
  - id: f_1
    predicate: More laser power is the primary fix while the detector is already at full scale.
