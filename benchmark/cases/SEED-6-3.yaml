task:
  statement: A gas cell is about 20 cm long, but the desired effective absorption path is tens of metres without
    a comparable increase in straight bench length.
  questions:
  - id: q1
    request: Propose a free-space multipass layout.
  - id: q2
    request: Explain the role of a multi-spot pattern on the mirrors.
  - id: q3
    request: Identify at least four important design constraints.
answer_contract:
  format: human_explanation_plus_json_object
  schema_id: pilot_answer_v0.1
  required_result_paths:
  - answers.q1
  - answers.q2
  - answers.q3
  method_shape:
    q1: Object giving the requested physical reasoning, design, calibration, or diagnostic evidence.
    q2: Object giving the requested physical reasoning, design, calibration, or diagnostic evidence.
    q3: Object giving the requested physical reasoning, design, calibration, or diagnostic evidence.
  permit_additional_explanation: true
gold:
  visibility: private
  universal_constraints:
  - id: c_q1
    severity: scored
    predicate: Propose a realizable multipass cell with controlled injection and output, such as a two-mirror
      Herriott layout or another stable folded path.
    evidence_path: answers.q1
  - id: c_q2
    severity: scored
    predicate: Explain that separated successive spots delay re-encounter of the entrance or exit aperture
      and accumulate gas path length over many passes.
    evidence_path: answers.q2
  - id: c_q3
    severity: scored
    predicate: Address at least four distinct constraints from mirror curvature and separation, stable trajectories,
      spot size and aperture, access hole position, injection angle, loss, aberration, and output separation.
    evidence_path: answers.q3
  accepted_solution_families:
  - id: herriott
    example: Use two curved mirrors with a spot pattern and extraction hole.
  - id: white_cell
    example: Use a White-style multiple-mirror imaging cell with controlled pass count.
  other_valid_families_policy: Any multipass free-space layout is valid if its geometry supports the claimed
    path length and usable separated input/output with bounded loss.
  forbidden_claims:
  - id: f_1
    predicate: Simply multiply the physical cell length without specifying a feasible return and extraction
      geometry.
