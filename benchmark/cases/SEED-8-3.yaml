  license_status: CC-BY-4.0 (project benchmark content)
task:
  statement: Map the local linear-birefringence axis and phase retardance of a thin sample over a two-dimensional
    field. State a sample model under which these quantities are identifiable.
  questions:
  - id: q1
    request: Design illumination, polarization preparation, sample, analyzer, and imaging paths.
  - id: q2
    request: Identify enough independent polarization settings or measurements to support inversion.
  - id: q3
    request: Explain the inversion, calibration, and remaining ambiguities.
answer_contract:
  format: human_explanation_plus_json_object
  schema_id: pilot_answer_v0.1
  required_result_paths:
  - answers.q1
  - answers.q2
  - answers.q3
  permit_additional_explanation: true
gold:
  universal_constraints:
  - id: c_q1
    severity: scored
    predicate: Use known incident polarization states, controlled analyzers, and spatially registered
      images with appropriate intensity references.
    evidence_path: answers.q1
  - id: c_q2
    severity: scored
    predicate: Collect sufficient independent states for the chosen Jones, Stokes, or Mueller model; identify
      how degeneracies are tested rather than assuming a single intensity image is enough.
    evidence_path: answers.q2
  - id: c_q3
    severity: scored
    predicate: Describe reconstruction of axis and retardance for a stated nondepolarizing-retarder or
      more general model, calibrate instrument birefringence, and address axis periodicity, retardance
      wrapping, diattenuation, and depolarization where relevant.
    evidence_path: answers.q3
  other_valid_families_policy: Listed examples are illustrative, not a closed whitelist; accept physically
    equivalent approaches satisfying the stated observable and constraints.
  accepted_solution_families:
  - id: rotating_analyzer
    example: Multiple input and analyzer angles constrain a thin linear-retarder model.
  - id: stokes_mueller
    example: State-resolved Stokes or Mueller imaging measures a richer sample response.
  - id: compensator_imaging
    example: A calibrated variable retarder and analyzer provide phase-sensitive polarization diversity.
