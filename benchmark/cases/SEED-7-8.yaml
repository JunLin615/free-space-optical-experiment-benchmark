gold:
  universal_constraints:
  - id: c_q1
    severity: scored
    predicate: Reject the simultaneous trend under the stated fixed-wavelength and fixed-beam-quality
      Gaussian assumptions.
    evidence_path: answers.q1
  - id: c_q2
    severity: scored
    predicate: Use z_R = π w_0²/(M² λ) for beam-quality factor M², reducing to π w_0²/λ for an ideal Gaussian;
      define w_0 as the 1/e² intensity radius.
    evidence_path: answers.q2
  - id: c_q3
    severity: scored
    predicate: Explain increased divergence, shorter depth of focus, and typically greater sensitivity
      to focusing and aberration when the spot shrinks.
    evidence_path: answers.q3
