task:
  statement: At fixed wavelength and fixed input beam quality, a passive free-space design is asked to
    make the focused beam radius progressively smaller while simultaneously making the Rayleigh range
    progressively longer.
  questions:
  - id: q1
    request: Decide whether the simultaneous trend is physically self-consistent for a paraxial Gaussian
      beam.
  - id: q2
    request: State the governing relation and its assumptions.
  - id: q3
    request: State the usual cost of a smaller focus.
