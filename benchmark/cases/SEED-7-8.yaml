  license_status: CC-BY-4.0 (project benchmark content)
task:
  statement: At fixed wavelength and fixed input beam quality, a passive free-space design is asked to
    make the focused beam radius progressively smaller while simultaneously making the Rayleigh range
    progressively longer.
  questions:
  - id: q1
    request: Decide whether the simultaneous trend is physically self-consistent for a paraxial Gaussian
      beam.
  - id: q2
    request: State the governing relation and its assumptions.
  - id: q3
    request: State the usual cost of a smaller focus.
answer_contract:
  format: human_explanation_plus_json_object
  schema_id: pilot_answer_v0.1
  required_result_paths:
  - answers.q1
  - answers.q2
  - answers.q3
  method_shape:
    q1: 'Boolean false or object with simultaneous_trend_possible: false under the stated fixed conditions.'
    q2: 'Object with relation: z_r_equals_pi_w0_squared_over_m2_lambda or z_r_proportional_to_w0_squared_at_fixed_lambda_m2; waist_definition: one_over_e_squared_intensity; and assumptions containing paraxial_gaussian, fixed_wavelength, fixed_beam_quality.'
    q3: 'String, list, or object with costs list naming at least one: shorter_rayleigh_range, shorter_depth_of_focus, greater_divergence. Do not claim an opposite trend.'
  permit_additional_explanation: true
gold:
  universal_constraints:
  - id: c_q1
    severity: scored
    predicate: Reject the simultaneous trend under the stated fixed-wavelength and fixed-beam-quality
      Gaussian assumptions.
    evidence_path: answers.q1
  - id: c_q2
    severity: scored
    predicate: Use z_R = π w_0²/(M² λ) for beam-quality factor M², reducing to π w_0²/λ for an ideal Gaussian;
      define w_0 as the 1/e² intensity radius.
    evidence_path: answers.q2
  - id: c_q3
    severity: scored
    predicate: State a usual cost of shrinking the waist at fixed wavelength and beam quality, such as increased divergence or shorter Rayleigh range and depth of focus. Greater sensitivity to focusing and aberration can also result but is not required.
    evidence_path: answers.q3
  other_valid_families_policy: Listed examples are illustrative, not a closed whitelist; accept physically
    equivalent approaches satisfying the stated observable and constraints.
