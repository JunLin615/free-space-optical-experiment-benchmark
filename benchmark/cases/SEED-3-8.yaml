  derivation: English translation of the original seed prompt and tasks. The small-angle relation is referenced
    to the lens optical axis; focal-plane measurement is the practical far-field equivalent.
  license_status: CC-BY-4.0 (project benchmark content)
task:
  statement: A laser beam far-field angular distribution must be measured, but the laboratory cannot place
    a detector at the physical far-field distance.
  questions:
  - id: q1
    request: Propose an equivalent lens-based angular measurement.
  - id: q2
    request: At which plane should the detector be located?
  - id: q3
    request: How does a detector transverse coordinate map approximately to propagation angle?
answer_contract:
  format: human_explanation_plus_json_object
  schema_id: pilot_answer_v0.1
  required_result_paths:
  - answers.q1
  - answers.q2
  - answers.q3
  permit_additional_explanation: true
gold:
  universal_constraints:
  - id: c_method
    severity: scored
    predicate: Use a lens to map incident angular components to transverse positions at an accessible
      focal plane.
    evidence_path: answers.q1
  - id: c_plane
    severity: scored
    predicate: Place the detector at the lens back focal plane, with adequate aperture and sampling for
      the angular range of interest.
    evidence_path: answers.q2
  - id: c_map
    severity: scored
    predicate: For small angles measured relative to the lens optical axis, x approximately equals f times
      theta; calibrate focal length and coordinate origin.
    evidence_path: answers.q3
  accepted_solution_families:
  - id: back_focal_plane
    example: Acquire an angular spectrum in the rear focal plane of a positive lens.
    family_checks:
    - focal_plane_location
    - angle_coordinate_calibration
  other_valid_families_policy: Accept an equivalent Fourier-lens or calibrated relay arrangement that
    maps angle to detector position.
  known_failure_modes:
  - Clipping at the lens aperture can distort the recovered angular distribution.
scoring:
  criteria:
  - id: c_method
    weight: 0.3
    check: c_method
  - id: c_plane
    weight: 0.3
    check: c_plane
  - id: c_map
    weight: 0.4
    check: c_map
  hard_rule: No score cap is proposed for this draft case; retain all criterion outcomes.
  malformed_answer_rule: Missing or invalid structured paths score zero for dependent criteria; preserve
    the parse error.
  aggregation: weighted_sum_then_hard_cap
validation:
