schema_version: 0.1.0
case_id: SEED-1-1
legacy_id: '1.1'
case_revision: 0.1.3
benchmark_release: null
validation_status: challenged
split: public_dev
title: Mirror rotation and far-field displacement
language: en
taxonomy:
  optical_domain: free_space_beam_geometry
  task_types:
  - quantitative_inference
  difficulty_hypothesis: introductory
  modality: text
provenance:
  origin: user_supplied_chinese_html_seed
  source_hash: 077DB14D2A5C67A3123C82AF1D571F8FFA73D3C79501C7C9D8C99E021C2318A8
  seed_relationship: Translation of case 1.1 in the original 64-case HTML seed.
  created_utc: '2026-09-28'
  source_references: []
  derivation: English translation of the original seed prompt and tasks. Revision 0.1.1 states the
    screen orientation and distance convention that were implicit in the seed and required by the numerical oracle.
    Revision 0.1.2 discloses a typed geometry-change answer for executable scoring without changing the scientific task.
    Revision 0.1.3 states that requested changes are magnitudes because the seed gives no rotation sense.
  license_status: CC-BY-4.0 (project benchmark content)
task:
  coordinate_convention: The direction and displacement questions request magnitudes; no clockwise or transverse sign was specified, so equivalent signed reports are compared by absolute value.
  statement: A collimated laser beam is incident nearly normally on an adjustable plane mirror. The mirror
    rotates 0.50° about a vertical axis. A viewing screen is normal to the nominal reflected ray, 2.0 m
    from the mirror along that ray. Neglect higher-order corrections associated with the initial angle of incidence.
    Report the angle change and spot displacement as magnitudes.
  questions:
  - id: q1
    request: Find the change in direction of the reflected beam.
  - id: q2
    request: Estimate the transverse displacement of the spot on the screen.
  - id: q3
    request: Identify the most direct geometric quantity to change if the displacement must fall to one
      quarter of its original value.
  givens:
  - value: 0.5
    unit: deg
    symbol: mirror_rotation
  - value: 2.0
    unit: m
    symbol: screen_distance
answer_contract:
  format: human_explanation_plus_json_object
  schema_id: pilot_answer_v0.1
  required_result_paths:
  - answers.q1.angle_change
  - answers.q2.spot_displacement
  - answers.q3.geometry_change
  quantity_shape:
    answers.q1.angle_change: 'Quantity {value, unit}; angle units deg or rad, magnitude scored.'
    answers.q2.spot_displacement: 'Quantity {value, unit}; length units m, mm, um, or nm, magnitude scored.'
  method_shape:
    q3: 'Object geometry_change with variable: screen_distance or mirror_rotation; held_fixed: the other variable; scale: dimensionless quantity giving new/old value. The exact distance-quarter and approximate rotation-quarter alternatives are accepted.'
  permit_additional_explanation: true
gold:
  reference_model:
    equation: reflected-ray rotation = 2*mirror rotation; transverse shift = L*tan(reflected-ray rotation)
    valid_if: screen distance is measured along the nominal reflected ray and screen is normal to it
  numerical_checks:
  - id: n_angle
    answer_path: answers.q1.angle_change
    reference:
      value: 1.0
      unit: deg
    absolute_tolerance:
      value: 0.02
      unit: deg
    relative_tolerance: 0.0
    comparator: max_abs_or_relative_inclusive
    validator_id: mirror_angle
    tolerance_rationale: Inclusive 0.02 deg allows two-significant-figure reporting from the 0.50 deg input; it is a scoring tolerance, not an instrument uncertainty.
  - id: n_shift
    answer_path: answers.q2.spot_displacement
    reference:
      value: 34.91
      unit: mm
    absolute_tolerance:
      value: 1.0
      unit: mm
    relative_tolerance: 0.0
    comparator: max_abs_or_relative_inclusive
    validator_id: mirror_spot_shift
    tolerance_rationale: Inclusive 1 mm allows rounded far-field shift reporting from a 2.0 m distance and nearly normal incidence; it is not a measured screen uncertainty.
  universal_constraints:
  - id: c_quarter
    severity: scored
    predicate: At fixed angle, reduce screen distance from mirror to one quarter; reducing mirror rotation
      to approximately one quarter is also acceptable
    evidence_path: answers.q3.geometry_change
  forbidden_claims:
  - id: f_one_to_one
    predicate: reflected_ray_rotates_only_by_mirror_rotation
scoring:
  criteria:
  - id: n_angle
    weight: 0.3
    check: n_angle
  - id: n_shift
    weight: 0.4
    check: n_shift
  - id: c_quarter
    weight: 0.3
    check: c_quarter
  hard_rule: No score cap is proposed for this draft case; retain all criterion outcomes.
  malformed_answer_rule: Missing or invalid structured paths score zero for dependent criteria; preserve
    the parse error.
  aggregation: weighted_sum_then_hard_cap
validation:
  planned_checks:
  - yaml_and_json_schema_valid
  - all_scoring_ids_resolve_and_weights_sum_to_one
  - independent_physics_review
  - positive_and_adversarial_answer_fixtures_pass
  implemented_checks:
  - independent_vector_reflection_and_screen_intersection
  - numerical_oracle_with_si_unit_conversion
  - typed_quarter_geometry_oracle
  - positive_boundary_alternative_and_adversarial_fixtures
  independent_derivation: Vector reflection about a rotated normal gives a 2-theta ray direction; intersection with the transverse screen gives L tan(2 theta). This independently matches the authored gold within the stated tolerance.
  adversarial_evidence: Factor-of-two reflection, wrong dimension, malformed and absent claims, and tolerance-boundary challenges are regression fixtures in benchmark/fixtures/SEED-1-1.
  evidence_files:
  - tests/test_independent_physics.py
  - tests/test_numerical_scoring.py
  semantic_criteria:
  - explanation_consistency
  notes: Challenged development case. Release requires a pinned manifest, wider challenge evidence, and CI preflight; it is not release_verified.
